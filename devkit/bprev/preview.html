// window.PREVIEW(scene) -> builds Render3D from {rows, materials, ids, signs, lights, lighting}
window.PREVIEW = function (sc) {
  const canvas = document.getElementById('c');
  Render3D.init({ canvas, staticParts: { parts: sc.rows, materials: sc.materials, ids: sc.ids, signs: sc.signs }, lights: sc.lights, lighting: sc.lighting, quality: sc.quality || 'high', pixelRatio: 1 });

window.SHOT = function (cam, clock) {
  const c = Render3D.camera;

  if (clock != null) Render3D.setLighting({ ClockTime: clock });
  Render3D.resize(96, 54);
  for (let i = 0; i < (cam.warm || 16); i++) Render3D.render(0.016);
  Render3D.resize(cam.w || 1280, cam.h || 720);
  Render3D.render(0.016);
  return Render3D.stats ? JSON.stringify(Render3D.stats()).slice(0, 300) : '';
};
