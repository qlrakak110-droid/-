<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>존재와 공허</title>
<meta name="theme-color" content="#07060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one full-bleed WebGL stage; every overlay is a floating glass panel pinned to a safe-area-aware edge.
   Duality palette: gold = 존재 (Being), violet = 공허 (Void). Single dark world by design. */
:root{
  color-scheme: dark;
  --ink:#07060c;
  --panel:rgba(14,11,26,.80);
  --panel-hi:rgba(30,24,52,.92);
  --line:rgba(226,212,255,.16);
  --line-hi:rgba(242,212,138,.55);
  --text:#efeaf9;
  --muted:#a69dc2;
  --gold:#f2d48a;
  --gold-hi:#fff0c4;
  --void:#b06bff;
  --void-deep:#5a2bb8;
  --hp-good:#5fe08c;
  --hp-mid:#f2c94c;
  --hp-low:#ff5a6a;
  --xp:#71b9ff;
  --f-display:'Gowun Batang','Noto Serif KR','AppleMyungjo','Batang',serif;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  --sa-t:env(safe-area-inset-top,0px);
  --sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px);
  --sa-r:env(safe-area-inset-right,0px);
  --edge:16px;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30}

/* ---------- loading ---------- */
#loading{background:radial-gradient(ellipse at 50% 45%,#1a1230 0%,#07060c 65%);gap:22px}
.load-mark{width:64px;height:64px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 50%,#000 0 38%,transparent 39%),conic-gradient(from 0deg,var(--gold),var(--void),var(--gold));
  animation:spin 2.4s linear infinite;box-shadow:0 0 40px rgba(176,107,255,.45)}
@keyframes spin{to{transform:rotate(360deg)}}
#loadMsg{font-family:var(--f-display);color:var(--muted);letter-spacing:.08em;margin:0;text-align:center;padding:0 var(--edge)}

/* ---------- title ---------- */
#title{background:linear-gradient(180deg,rgba(7,6,12,.0) 0%,rgba(7,6,12,.15) 55%,rgba(7,6,12,.85) 100%);justify-content:flex-end;
  padding:calc(var(--sa-t) + 24px) max(var(--edge),var(--sa-r)) calc(var(--sa-b) + 28px) max(var(--edge),var(--sa-l))}
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:640px}
.emblem{width:86px;height:86px;margin-bottom:-4px;filter:drop-shadow(0 0 12px rgba(176,107,255,.55)) drop-shadow(0 0 9px rgba(242,212,138,.45));animation:emblem 7s ease-in-out infinite}
@keyframes emblem{50%{transform:scale(1.045) rotate(2deg)}}
@media (max-width:640px){.emblem{width:62px;height:62px}}
.eyebrow{margin:0;font-family:var(--f-display);font-size:15px;letter-spacing:.6em;text-indent:.6em;color:var(--muted)}
.logo{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(54px,13vw,112px);line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:.08em}
.logo .being{background:linear-gradient(180deg,#fffaf0 0%,var(--gold) 55%,#b98a3a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(242,212,138,.55))}
.logo .and{font-size:.38em;color:var(--muted);font-weight:400;padding:0 .1em}
.logo .void{background:linear-gradient(180deg,#e9d6ff 0%,var(--void) 50%,#2a0f5c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(176,107,255,.7))}
.tag{margin:0;color:#d6cfe8;font-family:var(--f-display);font-size:16px;line-height:1.7;text-wrap:balance}
.title-btns{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.title-opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.credit{margin:18px 0 0;color:var(--muted);font-size:12px;text-align:center;letter-spacing:.02em}

.btn{border:1px solid var(--line);background:var(--panel);padding:14px 30px;border-radius:999px;font-weight:700;font-size:16px;letter-spacing:.04em;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s,border-color .15s,background .15s;min-height:48px}
.btn:hover{transform:translateY(-1px);border-color:var(--line-hi)}
.btn.primary{background:linear-gradient(180deg,#fff2c9,#e7c068);color:#2a1b05;border-color:transparent;box-shadow:0 8px 30px rgba(242,212,138,.35)}
.btn.void{background:linear-gradient(180deg,#c99bff,#7a3fe0);color:#12051f;border-color:transparent;box-shadow:0 8px 30px rgba(176,107,255,.4)}
.chip{border:1px solid var(--line);background:rgba(14,11,26,.6);padding:7px 14px;border-radius:999px;font-size:13px;color:#d9d2ec;min-height:34px}
.chip:hover{border-color:var(--line-hi)}

/* ---------- lore ---------- */
#lore{background:rgba(4,3,8,.55);padding:0 max(24px,var(--sa-l))}
#loreText{font-family:var(--f-display);font-size:clamp(19px,4.6vw,30px);line-height:1.75;text-align:center;max-width:760px;margin:0;text-wrap:balance;
  transition:opacity .9s ease;text-shadow:0 2px 24px rgba(0,0,0,.8)}
#loreText b.g{color:var(--gold);font-weight:700}
#loreText b.v{color:var(--void);font-weight:700}
#loreSkip{position:absolute;right:max(var(--edge),var(--sa-r));bottom:calc(var(--sa-b) + 20px)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#quest{position:absolute;left:max(var(--edge),var(--sa-l));top:calc(var(--sa-t) + 14px);max-width:min(62vw,420px);
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:3px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.q-label{font-size:11px;letter-spacing:.24em;color:var(--gold);font-weight:700}
#questText{font-family:var(--f-display);font-size:15px;line-height:1.45}
#questSub{font-size:12px;color:var(--muted)}
#hudBtns{position:absolute;right:max(var(--edge),var(--sa-r));top:calc(var(--sa-t) + 14px);display:flex;gap:8px;pointer-events:auto}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:700;min-height:40px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ibtn:hover{border-color:var(--line-hi)}
.ibtn{display:inline-flex;align-items:center;gap:6px}
.ibtn .hico{width:16px;height:16px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#prompt{position:absolute;left:50%;bottom:calc(var(--sa-b) + 34%);transform:translateX(-50%);background:var(--panel-hi);border:1px solid var(--line-hi);
  padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 0 30px rgba(242,212,138,.25)}
#prompt kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--gold);color:#241603;font-family:var(--f-ui);font-size:12px;margin-right:8px;padding:0 5px}
#leadCard{position:absolute;left:max(var(--edge),var(--sa-l));bottom:calc(var(--sa-b) + 16px);display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;min-width:200px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#leadCard img{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.05)}
#leadCard .lc-body{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
#leadCard .lc-name{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
#leadCard .lc-name span{color:var(--muted);font-weight:500;font-size:12px;font-variant-numeric:tabular-nums}
.has-touch #leadCard{left:50%;transform:translateX(-50%);bottom:calc(var(--sa-b) + 12px);min-width:170px;padding:6px 10px 6px 6px}
.has-touch #leadCard img{width:34px;height:34px}

.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.bar > i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--hp-good);transition:width .35s ease,background-color .35s}
.bar.xp{height:4px}
.bar.xp > i{background:var(--xp)}

/* ---------- touch ---------- */
#touch{position:absolute;inset:0;pointer-events:none;z-index:12}
#stick{position:absolute;left:max(22px,var(--sa-l));bottom:calc(var(--sa-b) + 70px);width:128px;height:128px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(242,212,138,.25);border:1px solid var(--line-hi)}
#tA{position:absolute;right:max(22px,var(--sa-r));bottom:calc(var(--sa-b) + 96px);width:76px;height:76px;border-radius:50%;border:1px solid var(--line-hi);
  background:radial-gradient(circle at 40% 35%,rgba(255,240,196,.35),rgba(242,212,138,.12));font-weight:700;font-size:22px;pointer-events:auto;color:var(--gold-hi)}
#tRun{position:absolute;right:max(110px,calc(var(--sa-r) + 110px));bottom:calc(var(--sa-b) + 70px);width:62px;height:62px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);font-size:12px;font-weight:700;pointer-events:auto}
#tRun.on{border-color:var(--line-hi);color:var(--gold)}

/* ---------- dialog ---------- */
#dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sa-b) + 18px);width:min(760px,calc(100% - 2*var(--edge) - var(--sa-l) - var(--sa-r)));
  background:linear-gradient(180deg,rgba(24,19,42,.94),rgba(12,9,22,.96));border:1px solid var(--line);border-radius:18px;padding:16px 20px 18px;z-index:20;
  box-shadow:0 20px 60px rgba(0,0,0,.55);cursor:pointer;min-height:96px}
#dialog::before{content:"";position:absolute;left:20px;right:20px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),var(--void),transparent)}
#dWho{font-family:var(--f-display);font-weight:700;color:var(--gold);font-size:15px;margin-bottom:6px;letter-spacing:.04em}
#dWho.void{color:var(--void)}
#dWho:empty{display:none}
#dTxt{font-family:var(--f-display);font-size:17px;line-height:1.7;white-space:pre-wrap;min-height:1.7em}
#dialog .next{position:absolute;right:18px;bottom:10px;color:var(--gold);font-size:12px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#dChoices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#dChoices:empty{display:none}
#dChoices button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
#dChoices button:hover,#dChoices button:focus-visible{border-color:var(--line-hi);background:rgba(242,212,138,.12)}

/* ---------- starter select ---------- */
#select{position:absolute;inset:0;z-index:15;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding:0 max(var(--edge),var(--sa-r)) calc(var(--sa-b) + 20px) max(var(--edge),var(--sa-l))}
.sel-card{pointer-events:auto;width:min(560px,100%);background:var(--panel-hi);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.sel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sel-head h3{margin:0;font-family:var(--f-display);font-size:26px}
.sel-desc{margin:0;color:#d4cce6;font-family:var(--f-display);line-height:1.65;font-size:15px}
.sel-row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.sel-match,.sel-moves{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.sel-match .lbl,.sel-moves .lbl{color:var(--muted);font-weight:700;letter-spacing:.04em;margin-right:2px}
.sel-match .lbl:not(:first-child){margin-left:10px}
.sel-match em{font-style:normal;color:var(--muted)}
.sel-moves b{font-weight:700;padding:3px 9px;border-radius:7px;background:color-mix(in srgb,var(--tc) 22%,rgba(255,255,255,.04));border-left:3px solid var(--tc)}
.sel-nav{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:18px}
.sel-stats{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;font-size:12px;color:var(--muted);align-items:center;font-variant-numeric:tabular-nums}

.type{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.03em;color:#160f22;white-space:nowrap}

/* ---------- battle ---------- */
#battleUI{position:absolute;inset:0;z-index:11;pointer-events:none}
.bp{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px 12px;width:min(320px,calc(50vw - 24px));
  display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .3s,transform .3s}
.bp.foe{left:max(var(--edge),var(--sa-l));top:calc(var(--sa-t) + 14px)}
.bp.ally{right:max(var(--edge),var(--sa-r));bottom:calc(var(--sa-b) + 190px)}
.bp.off{opacity:0;transform:translateY(-8px)}
.listing .bp.ally{opacity:0;pointer-events:none}
.bp .bp-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bp .nm{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp .lv{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bp .types{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.bp .st{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#ff8a4c;color:#2a0e00}
.bp .st.para{background:#ffd23f;color:#2a2000}
.bp .hpline{display:flex;align-items:center;gap:8px}
.bp .hpline .bar{flex:1;height:9px}
.bp .hpline b{font-size:11px;color:var(--muted);letter-spacing:.1em}
.bp .hpnum{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bp.legend{border-color:rgba(176,107,255,.55);box-shadow:0 0 34px rgba(176,107,255,.25)}
.bp.legend.being{border-color:rgba(242,212,138,.6);box-shadow:0 0 34px rgba(242,212,138,.25)}
.party-dots{display:flex;gap:4px}
.party-dots i{width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:.9}
.party-dots i.out{background:#4a4360}

#bBox{position:absolute;left:max(var(--edge),var(--sa-l));right:max(var(--edge),var(--sa-r));bottom:calc(var(--sa-b) + 14px);display:flex;gap:12px;align-items:stretch;pointer-events:auto}
#bMsg{flex:1;min-width:0;background:linear-gradient(180deg,rgba(24,19,42,.94),rgba(12,9,22,.96));border:1px solid var(--line);border-radius:16px;padding:14px 18px;
  font-family:var(--f-display);font-size:17px;line-height:1.6;min-height:84px;display:flex;align-items:center;white-space:pre-wrap}
#bCmd{width:min(430px,48vw);display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.cmd.back.mini{position:absolute;left:0;right:auto;top:-38px;min-height:30px;padding:4px 14px;border-radius:999px;flex-direction:row;gap:6px}
.cmd.back.mini .c-t{font-size:12.5px}
.cmd.back.mini kbd{font-size:10px;font-weight:700;font-family:inherit;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.12);color:var(--muted)}
#bCmd:empty{display:none}
.cmd{border:1px solid var(--line);background:var(--panel-hi);border-radius:14px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:56px;
  transition:border-color .15s,transform .12s,background .15s}
.cmd:hover:not(:disabled),.cmd:focus-visible{border-color:var(--line-hi);transform:translateY(-1px)}
.cmd:disabled{opacity:.4;cursor:default}
.cmd .c-t{font-weight:700;font-size:15px}
.cmd .c-s{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cmd.mv{border-left-width:4px}
.cmd.back{grid-column:1 / -1;min-height:40px;text-align:center;align-items:center}
.cmd.list{grid-column:1 / -1;flex-direction:row;align-items:center;gap:10px}
.cmd.list img{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.05)}
.cmd.list .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
#bCmd.scroll{max-height:46vh;overflow:auto;align-content:start}

#pops{position:absolute;inset:0;pointer-events:none;z-index:13}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:26px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 18px rgba(0,0,0,.6);
  animation:popUp 1.1s ease-out forwards;white-space:nowrap;font-variant-numeric:tabular-nums}
.pop.big{font-size:34px;color:#ffe08a}
.pop.weak{font-size:20px;color:#b8b0d0}
.pop.heal{color:#7dffa8}
.pop small{display:block;font-size:13px;text-align:center;letter-spacing:.08em}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-160%)}}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:25;background:rgba(5,4,10,.6);display:flex;align-items:center;justify-content:center;
  padding:calc(var(--sa-t) + 16px) max(var(--edge),var(--sa-r)) calc(var(--sa-b) + 16px) max(var(--edge),var(--sa-l));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal-card{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(26,20,46,.97),rgba(12,9,22,.98));
  border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-card header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal-card h2{margin:0;font-family:var(--f-display);font-size:20px}
#mTabs{display:flex;gap:6px;padding:10px 18px 0;flex-wrap:wrap}
#mTabs:empty{display:none}
#mTabs button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--muted)}
#mTabs button.on{color:#241603;background:var(--gold);border-color:transparent}
#mBody{overflow:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.mon-row{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(255,255,255,.02);text-align:left;width:100%}
.mon-row:hover,.mon-row.sel{border-color:var(--line-hi)}
.mon-row img{width:56px;height:56px;border-radius:12px;background:rgba(255,255,255,.05);flex:none}
.mon-row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mon-row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mon-row .top b{font-family:var(--f-display);font-size:17px}
.mon-row .top span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mon-row .badge{font-size:10px;font-weight:700;color:#241603;background:var(--gold);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}
.detail{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.02)}
.detail p{margin:0;font-family:var(--f-display);color:#d4cce6;line-height:1.65}
.detail .moves{display:grid;grid-template-columns:1fr 1fr;gap:6px}

    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }

// ---------------------------------------------------------------- settings
const isTouch = (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window);
const Settings = { high: !isTouch || Math.min(screen.width, screen.height) > 700, ultra: !isTouch, sound: true };
try { const s = JSON.parse(localStorage.getItem('void-being-settings') || 'null'); if (s) Object.assign(Settings, s); } catch (e) {}
function saveSettings() { try { localStorage.setItem('void-being-settings', JSON.stringify(Settings)); } catch (e) {} }

// ---------------------------------------------------------------- renderer
// Physically based setup (r160): physical light units (no legacy π scaling — a DirectionalLight of intensity I gives
// albedo·I/π on a surface facing it), linear working space, sRGB output. Tone mapping happens ONCE at the end:
//   HIGH (PC): scene → half-float MSAA target (scene-linear HDR) → GTAO → bloom → final pass (sun rays + flare in HDR,
//              exposure, neutral filmic curve, grade, sRGB, vignette, grain) → screen
//   LOW (phones): renderer.render straight to the screen; the SAME curve + grade runs inside every material
//              (CustomToneMapping below), so both paths look alike at no extra cost.
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.CustomToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ---- shared tone curve + grade (GLSL). spTone: scene-linear → display-linear. spGrade works on display (sRGB) values.
// The curve is hue-preserving and linear through the mid-tones with a long soft shoulder (after Khronos PBR Neutral,
// with a gentler toe and an earlier, softer shoulder), so albedo reads true, greens stay natural, and bright colours
// bleach smoothly toward white instead of clipping or shifting hue (no neon, no orange→yellow skew).
const GRADE_GLSL = `
  vec3 spToS( vec3 c ) { c = max( c, 0.0 ); return mix( c * 12.92, 1.055 * pow( c, vec3( 0.41666 ) ) - 0.055, step( 0.0031308, c ) ); }
  vec3 spFromS( vec3 c ) { c = max( c, 0.0 ); return mix( c * 0.0773994, pow( ( c + 0.055 ) * 0.947867, vec3( 2.4 ) ), step( 0.04045, c ) ); }
  vec3 spTone( vec3 c ) {
    const float TOE = 0.014, START = 0.6, DESAT = 0.16;
    c = max( c, 0.0 );
    float x = min( c.r, min( c.g, c.b ) );
    c -= x < 2.0 * TOE ? x - x * x / ( 4.0 * TOE ) : TOE;
    float peak = max( c.r, max( c.g, c.b ) );
    if ( peak < START ) return c;
    const float D = 1.0 - START;
    float np = 1.0 - D * D / ( peak + D - START );
    c *= np / peak;
    return mix( c, vec3( np ), 1.0 - 1.0 / ( DESAT * ( peak - np ) + 1.0 ) );
  }
  // display-space grade: foliage taming, vibrance/saturation, luma S-curve (adds contrast without adding saturation),
  // split toning (cool shadows, warm highlights) and a tiny black lift
  vec3 spGrade( vec3 c, float con, float sat, float vib, float green, vec3 warm, vec3 cool, vec3 lift ) {
    c = clamp( c, 0.0, 1.0 );
    float L = dot( c, vec3( 0.2126, 0.7152, 0.0722 ) );
    float gm = smoothstep( 0.03, 0.28, c.g - max( c.r, c.b ) ) * green;
    c = mix( c, vec3( L ), gm * 0.2 ); c.r += gm * 0.05 * c.g;
    float s = max( c.r, max( c.g, c.b ) ) - min( c.r, min( c.g, c.b ) );
    c = clamp( mix( vec3( L ), c, sat + vib * ( 1.0 - smoothstep( 0.05, 0.5, s ) ) * smoothstep( 0.02, 0.2, L ) ), 0.0, 1.0 );
    float L1 = max( dot( c, vec3( 0.2126, 0.7152, 0.0722 ) ), 1e-4 );
    float L2 = clamp( L1 + con * L1 * ( 1.0 - L1 ) * ( 2.0 * L1 - 1.0 ), 0.0, 1.0 );
    c = clamp( c * ( L2 / L1 ), 0.0, 1.0 );
    c += cool * ( 1.0 - smoothstep( 0.04, 0.5, L2 ) );
    c *= 1.0 + warm * smoothstep( 0.45, 0.95, L2 );
    return clamp( c + lift * ( 1.0 - c ), 0.0, 1.0 );
  }
`;

// look presets per mode (world / battle / legend), picked automatically in renderScene() and eased in Post.update().
// exp: exposure · con: S-curve · sat/vib: saturation / vibrance · green: foliage taming · vig: vignette ·
// shaft/flare: sun rays / lens flare strength · bloom/thr/knee/rad: bloom strength, HDR threshold, soft knee, radius
const LOOK = {
  world:  { exp: 1.18, con: 0.16, sat: 1.03, vib: 0.1, green: 1.0, vig: 0.2, warm: [0.03, 0.012, -0.03], cool: [-0.004, 0.002, 0.014], lift: [0.006, 0.004, 0.01], tint: [1.0, 0.985, 0.96], shaft: 0.4, flare: 0.6, bloom: 0.3, thr: 1.45, knee: 0.7, rad: 0.32, glow: [1.0, 0.95, 0.88], grain: 0.012 },
  battle: { exp: 1.16, con: 0.19, sat: 1.05, vib: 0.12, green: 0.9, vig: 0.24, warm: [0.035, 0.014, -0.034], cool: [-0.005, 0.002, 0.018], lift: [0.006, 0.003, 0.012], tint: [1.0, 0.98, 0.95], shaft: 0.36, flare: 0.55, bloom: 0.34, thr: 1.35, knee: 0.7, rad: 0.32, glow: [1.0, 0.95, 0.88], grain: 0.012 },
  legend: { exp: 1.12, con: 0.22, sat: 1.04, vib: 0.1, green: 0.8, vig: 0.32, warm: [0.03, 0.01, -0.028], cool: [-0.004, 0.004, 0.024], lift: [0.008, 0.004, 0.016], tint: [1.0, 0.99, 0.98], shaft: 0.3, flare: 0.55, bloom: 0.46, thr: 1.2, knee: 0.75, rad: 0.42, glow: [1.0, 0.97, 0.94], grain: 0.014 },
};

// LOW path: the world look, folded into the tone-mapping function every built-in material calls
THREE.ShaderChunk.tonemapping_pars_fragment = THREE.ShaderChunk.tonemapping_pars_fragment.replace(
  'vec3 CustomToneMapping( vec3 color ) { return color; }',
  GRADE_GLSL + (() => {
    const L = LOOK.world, f = (v) => (+v).toFixed(4), v3 = (a) => `vec3( ${a.map(f).join(', ')} )`;
    return `vec3 CustomToneMapping( vec3 color ) {
      vec3 c = spToS( spTone( color * ( toneMappingExposure * ${f(L.exp)} ) ) );
      c = spGrade( c, ${f(L.con)}, ${f(L.sat)}, ${f(L.vib)}, ${f(L.green)}, ${v3(L.warm)}, ${v3(L.cool)}, ${v3(L.lift)} ) * ${v3(L.tint)};
      return spFromS( c );
    }`;
  })());

// LOW path parity: hand-written ShaderMaterials (sky, water, grass, outlines, particles, …) get the same tone mapping
// and sRGB output that built-in materials get, so a phone shows the same image as the PC (where the final pass grades
// everything). Only for the main renderer, only when the material is tone-mapped and drawn straight to the screen
// (render targets — the whole PC composer — get NoToneMapping and stay untouched). Shaders that already handle their
// output are left alone. Works unbound (other files chain onBeforeCompile without `this`).
THREE.ShaderMaterial.prototype.onBeforeCompile = function (sh, r) {
  if (r !== renderer || !sh || sh.isRawShaderMaterial || sh.shaderID || sh.toneMapping !== THREE.CustomToneMapping) return;
  if (this && this.userData && this.userData.noLowTone) return;
  const fs = sh.fragmentShader;
  if (typeof fs !== 'string' || /tonemapping_fragment|colorspace_fragment|linearToOutputTexel|toneMapping\s*\(/.test(fs)) return;
  const re = /void\s+main\s*\(\s*(void)?\s*\)\s*\{/g, hits = fs.match(re);
  if (!hits || hits.length !== 1) return;
  re.lastIndex = 0; const m = re.exec(fs); let d = 0, end = -1;
  for (let k = m.index + m[0].length - 1; k < fs.length; k++) { const ch = fs[k]; if (ch === '{') d++; else if (ch === '}' && --d === 0) { end = k; break; } }
  if (end < 0) return;
  sh.fragmentShader = fs.slice(0, end) + '\n  #include <tonemapping_fragment>\n  #include <colorspace_fragment>\n' + fs.slice(end);
};

// ---- soft shadows: when a light's shadow.radius > 1, the PCF-soft lookup becomes a 12-tap disc of bilinear-filtered
// compares (radius in texels). Fixed pattern (no per-pixel rotation), so penumbrae are smooth AND don't crawl when the
// camera moves. radius <= 1 keeps three's own 3×3 tent.
{
  let ch = THREE.ShaderChunk.shadowmap_pars_fragment;
  const A = '#elif defined( SHADOWMAP_TYPE_PCF_SOFT )', B = '#elif defined( SHADOWMAP_TYPE_VSM )', F = 'float getShadow( sampler2D shadowMap,';
  const ia = ch.indexOf(A), ib = ch.indexOf(B, ia), iF = ch.indexOf(F);
  if (ia > 0 && ib > ia && iF > 0 && iF < ia) {
    const fn = `
    float spShadowBilin( sampler2D m, vec2 uv, vec2 size, float z ) {
      vec2 t = 1.0 / size, f = fract( uv * size + 0.5 ); uv -= f * t;
      return mix( mix( texture2DCompare( m, uv, z ), texture2DCompare( m, uv + vec2( t.x, 0.0 ), z ), f.x ),
                  mix( texture2DCompare( m, uv + vec2( 0.0, t.y ), z ), texture2DCompare( m, uv + t, z ), f.x ), f.y );
    }
    float spShadowDisc( sampler2D m, vec2 size, float r, vec4 sc ) {
      vec2 t = r / size; float s = spShadowBilin( m, sc.xy, size, sc.z ) * 0.5; float w = 0.5;
      for ( int i = 0; i < 11; i++ ) {
        float fi = float( i ), a = fi * 2.39996 + 0.6, rr = sqrt( ( fi + 0.5 ) / 11.0 );
        float k = 1.0 - 0.45 * rr;
        s += spShadowBilin( m, sc.xy + vec2( cos( a ), sin( a ) ) * rr * t, size, sc.z ) * k; w += k;
      }
      return s / w;
    }
    `;
    ch = ch.slice(0, iF) + fn + ch.slice(iF, ia) + A + '\n if ( shadowRadius > 1.01 ) { shadow = spShadowDisc( shadowMap, shadowMapSize, shadowRadius, shadowCoord ); } else {\n'
      + ch.slice(ia + A.length, ib) + '}\n' + ch.slice(ib);
    THREE.ShaderChunk.shadowmap_pars_fragment = ch;
  }
}

// multisampled HDR target so the post-processed image keeps clean edges
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: isTouch ? 2 : 4 }));
const renderPass = new RenderPass(new THREE.Scene(), new THREE.PerspectiveCamera());
composer.addPass(renderPass);
// ground-truth ambient occlusion (ultra tier): contact shadows and crevices, computed at half resolution.
// Radius ~1.2 m with a near-weighted falloff: feet, rocks, walls and props get a soft grounding pool where they meet
// the terrain, without dirty halos around big shapes.
const aoCam = new THREE.PerspectiveCamera(50, 1, 0.1, 1600);
const gtaoPass = new GTAOPass(new THREE.Scene(), aoCam, 256, 256, undefined, { radius: 1.2, distanceExponent: 1.7, thickness: 1.4, scale: 1.0, samples: 12, distanceFallOff: 1, screenSpaceRadius: false }, { lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 12 });
gtaoPass.blendIntensity = 0.92;
{
  const setSz = gtaoPass.setSize.bind(gtaoPass);
  gtaoPass.setSize = (w, h) => setSz(Math.max(1, Math.floor(w / 2)), Math.max(1, Math.floor(h / 2)));
  gtaoPass.overrideVisibility = function () {
    const cache = this._visibilityCache;
    this.scene.traverse((o) => { cache.set(o, o.visible); if (o.isPoints || o.isLine || o.isSprite || (o.material && (o.material.transparent || o.material.userData.noAO || o.material.isShaderMaterial && !o.material.userData.ao))) o.visible = false; });
  };
}
composer.addPass(gtaoPass);
// bloom works in scene-linear HDR BEFORE tone mapping, with a high threshold: only true emissives, sparks, specular
// glints and the sun disc glow; sunlit walls, sand and bright sky stay crisp. Strength is low and the result passes
// through the tone curve, so even the sun can't wash the frame.
const bloomPass = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.3, 0.32, 1.45);
bloomPass.highPassUniforms.smoothWidth.value = 0.7; // = knee width
bloomPass.materialHighPassFilter.fragmentShader = `uniform sampler2D tDiffuse; uniform vec3 defaultColor; uniform float defaultOpacity; uniform float luminosityThreshold; uniform float smoothWidth; varying vec2 vUv;
  void main(){
    vec3 c = min(texture2D(tDiffuse, vUv).rgb, vec3(24.0));
    float br = max(c.r, max(c.g, c.b));
    float knee = max(smoothWidth, 1e-3);
    float rq = clamp(br - luminosityThreshold + knee, 0.0, 2.0 * knee);
    rq = rq * rq / (4.0 * knee);
    float w = max(rq, br - luminosityThreshold) / max(br, 1e-4);
    float a = smoothstep(luminosityThreshold - knee * 0.25, luminosityThreshold + knee * 0.5, br);
    // soft-compress very hot sources (the sun disc, big emissive columns) so one object can't flood the frame
    vec3 cw = c * w; cw /= 1.0 + max(cw.r, max(cw.g, cw.b)) * 0.45;
    gl_FragColor = vec4(cw, a);
  }`;
bloomPass.materialHighPassFilter.needsUpdate = true;
composer.addPass(bloomPass);

// final pass (HDR in, display out): shockwave ripple, chromatic aberration, crepuscular rays + lens flare (both in
// scene-linear, bounded), exposure, neutral filmic tone curve, grade, vignette, grain.
// Post.setMode('legend') forces a look, Post.setMode(null) returns to automatic.
const Post = {
  U: {
    tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) },
    uVig: { value: 0.2 }, uCA: { value: 0 }, uGrain: { value: 0.012 }, uSat: { value: 1.03 }, uLift: { value: new THREE.Vector3(0.006, 0.004, 0.01) },
    uShock: { value: new THREE.Vector4(0.5, 0.5, -1, 0) }, uSun: { value: new THREE.Vector3(0.5, 0.5, 0) }, uTint: { value: new THREE.Vector3(1, 1, 1) },
    uCon: { value: 0.16 }, uVib: { value: 0.1 }, uWarm: { value: new THREE.Vector3(0.03, 0.012, -0.03) }, uCool: { value: new THREE.Vector3(-0.004, 0.002, 0.014) },
    uFlare: { value: 0.55 }, uShaft: { value: 0.3 }, uExp: { value: 1.18 }, uGreen: { value: 1 }, uSunCol: { value: new THREE.Vector3(1.0, 0.86, 0.68) },
  },
  presets: LOOK,
  // per-arena accents layered on the legend look
  themes: {
    void:     { warm: [0.015, 0.0, 0.0], cool: [0.004, -0.003, 0.03], vig: 0.42, tint: [0.97, 0.94, 1.0] },
    being:    { warm: [0.05, 0.022, -0.04], tint: [1.0, 0.96, 0.88], exp: 1.2, bloom: 0.55 },
    star:     { cool: [-0.006, 0.005, 0.034], tint: [0.95, 0.97, 1.0] },
    abyss:    { warm: [0.0, 0.015, 0.0], cool: [-0.008, 0.01, 0.03], tint: [0.9, 0.99, 1.0] },
    dawn:     { warm: [0.05, 0.018, -0.04], con: 0.2, tint: [1.0, 0.94, 0.86] },
    boundary: { con: 0.26, vig: 0.4 },
  },
  mode: 'world', theme: null, forced: null, _snap: true, exposure: 1,
  setMode(m) { this.forced = m && this.presets[m] ? m : null; },
  shockT: -1, shockAmp: 0, caKick: 0,
  shock(world, cam, amp = 1) {
    const v = world.clone().project(cam);
    this.U.uShock.value.set((v.x + 1) / 2, (v.y + 1) / 2, 0, amp); this.shockT = 0; this.shockAmp = amp;
  },
  kick(ca = 0.02) { this.caKick = Math.max(this.caKick, ca); },
  update(dt) {
    this.U.uTime.value += dt;
    if (this.shockT >= 0) { this.shockT += dt * 1.25; if (this.shockT >= 1) { this.shockT = -1; this.U.uShock.value.z = -1; } else this.U.uShock.value.z = this.shockT; }
    this.caKick = Math.max(0, this.caKick - dt * 0.08);
    this.U.uCA.value = this.caKick;
    // ease the look toward the active preset (snaps on the first frame)
    const m = this.forced || this.mode, base = this.presets[m] || this.presets.world, U = this.U;
    const P = m === 'legend' && this.themes[this.theme] ? Object.assign({}, base, this.themes[this.theme]) : base;
    const k = this._snap ? 1 : 1 - Math.exp(-2.2 * dt); this._snap = false;
    const f = (u, v) => { u.value = lerp(u.value, v, k); };
    f(U.uCon, P.con); f(U.uVib, P.vib); f(U.uSat, P.sat); f(U.uVig, P.vig); f(U.uFlare, P.flare); f(U.uShaft, P.shaft);
    f(U.uGreen, P.green); f(U.uGrain, P.grain); f(U.uExp, P.exp * this.exposure * renderer.toneMappingExposure);
    const v3 = (u, a) => { u.x = lerp(u.x, a[0], k); u.y = lerp(u.y, a[1], k); u.z = lerp(u.z, a[2], k); };
    v3(U.uWarm.value, P.warm); v3(U.uCool.value, P.cool); v3(U.uLift.value, P.lift); v3(U.uTint.value, P.tint);
    bloomPass.strength = lerp(bloomPass.strength, P.bloom, k); bloomPass.threshold = lerp(bloomPass.threshold, P.thr, k);
    bloomPass.radius = lerp(bloomPass.radius, P.rad, k);
    const hk = bloomPass.highPassUniforms.smoothWidth; hk.value = lerp(hk.value, P.knee, k);
    // the wide bloom mips carry a faint warm veil (light scattering in the air/lens), the tight ones stay neutral so
    // glows keep their own colour
    const T = bloomPass.bloomTintColors;
    for (let i = 0; i < T.length; i++) { const t = i / (T.length - 1); T[i].set(lerp(1, P.glow[0], t), lerp(1, P.glow[1], t), lerp(1, P.glow[2], t)); }
  },
};
const finalPass = new ShaderPass(new THREE.ShaderMaterial({
  uniforms: Post.U, toneMapped: false, depthTest: false, depthWrite: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uVig, uCA, uGrain, uSat, uCon, uVib, uFlare, uShaft, uExp, uGreen; uniform vec2 uRes; uniform vec4 uShock;
    uniform vec3 uSun, uLift, uTint, uWarm, uCool, uSunCol; varying vec2 vUv;
    ${GRADE_GLSL}
    float luma(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
    vec3 hdr(vec2 p){ return texture2D(tDiffuse, clamp(p, 0.001, 0.999)).rgb; }
    // one soft lens ghost: filled disc + faint rim, centre c, radius r
    vec3 ghost(vec2 p, vec2 c, float r, vec3 col){ float d = length(p - c); return col * (smoothstep(r, r * 0.4, d) * 0.6 + smoothstep(r * 0.08, 0.0, abs(d - r * 0.92)) * 0.4); }
    void main(){
      vec2 uv = vUv;
      if (uShock.z >= 0.0) {
        vec2 d = uv - uShock.xy; d.x *= uRes.x / uRes.y; float r = length(d);
        float band = smoothstep(0.11, 0.0, abs(r - uShock.z * 0.9)) * (1.0 - uShock.z);
        uv -= normalize(uv - uShock.xy + 1e-5) * band * uShock.w * 0.035;
      }
      vec2 c = uv - 0.5;
      float asp = uRes.x / uRes.y;
      float ca = uCA + 0.0009 * dot(c, c) * 4.0;
      vec3 col = vec3(texture2D(tDiffuse, uv + c * ca).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - c * ca).b);
      if (uSun.z > 0.001) {
        // crepuscular rays: march toward the sun; only HDR energy above a high threshold close to the sun emits (the
        // disc and the glare right around it), and the march is AVERAGED, so the rays are bounded — dark streaks where
        // leaves/roofs block the sun, a soft radial glow where it's clear, never a white-out
        vec2 dl = (uv - uSun.xy) * (0.9 / 24.0); vec2 sp = uv; float w = 1.0, ws = 0.0; vec3 acc = vec3(0.0);
        for (int i = 0; i < 24; i++) {
          sp -= dl; vec3 s = min(hdr(sp), vec3(12.0)); float l = luma(s);
          float near = 1.0 - smoothstep(0.02, 0.26, length((sp - uSun.xy) * vec2(asp, 1.0)));
          acc += s * (max(l - 1.25, 0.0) / max(l, 1e-3)) * near * w; ws += w; w *= 0.94;
        }
        float dsun = length((uv - uSun.xy) * vec2(asp, 1.0));
        col += acc / ws * uSunCol * (uSun.z * uShaft * exp(-dsun * 2.2));
        // lens flare: only while the sun disc itself is on screen and not hidden behind something
        vec2 ndc = uSun.xy * 2.0 - 1.0;
        float onS = 1.0 - smoothstep(0.9, 1.05, max(abs(ndc.x), abs(ndc.y)));
        if (onS * uFlare > 0.001) {
          vec2 o = vec2(0.006 / asp, 0.006);
          float occ = (luma(hdr(uSun.xy)) * 2.0 + luma(hdr(uSun.xy + vec2(o.x, 0.0))) + luma(hdr(uSun.xy - vec2(o.x, 0.0))) + luma(hdr(uSun.xy + vec2(0.0, o.y))) + luma(hdr(uSun.xy - vec2(0.0, o.y)))) / 6.0;
          float vis = smoothstep(1.8, 3.6, occ) * onS * min(uSun.z * 1.6, 1.0) * uFlare;
          if (vis > 0.001) {
            vec2 p = vec2(c.x * asp, c.y), s = vec2((uSun.x - 0.5) * asp, uSun.y - 0.5), d = p - s;
            float r = length(d);
            // veiling glare: a white-hot core, a warm halo and a faint wide veil around the disc
            vec3 fl = uSunCol * (exp(-r * 38.0) * 0.5 + exp(-r * 13.0) * 0.2 + exp(-r * 4.5) * 0.035);

// ---- 00b_assets.js ----
// ============================================================================
//  asset library: textures and glTF models authored offline (spirit-island/tools/)
//  and loaded at boot. Every consumer must keep a procedural fallback: when the
//  page is opened from file:// (no HTTP) or a file is missing, Assets.* returns null.
// ============================================================================
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const Assets = {
  base: 'assets/', tex: {}, models: {}, ready: false, failed: [],
  _want: { textures: {}, models: {} },
};
// Called at top level by any src file:  registerAssets({ textures: { rock_a: { file: 'tex/rock_a.jpg', lo: 'tex/rock_a_512.jpg', srgb: true } }, models: { house_a: 'models/house_a.glb' } })
//  - textures: srgb true for colour maps, false (default) for normal / ORM / height maps; lo = smaller file used on phones
//  - models: path, or { file, lo }
function registerAssets(def) {
  Object.assign(Assets._want.textures, def.textures || {});
  Object.assign(Assets._want.models, def.models || {});
}
// texture lookup: a THREE.Texture (shared, RepeatWrapping) or null
function assetTex(name) { return Assets.tex[name] || null; }
// model lookup: a fresh clone of the glTF scene (materials shared) or null
function assetModel(name) { const g = Assets.models[name]; return g ? g.scene.clone(true) : null; }
function assetGltf(name) { return Assets.models[name] || null; }

Assets.loadAll = async function (onProgress) {
  const W = Assets._want, jobs = [];
  if (location.protocol === 'file:') { Assets.ready = true; return; }      // WebGL can't use file:// images; fall back to procedural
  const lo = typeof Settings !== 'undefined' && !Settings.high;
  const tl = new THREE.TextureLoader(), gl = new GLTFLoader();
  let done = 0; const total = Object.keys(W.textures).length + Object.keys(W.models).length;
  const tick = () => { done++; if (onProgress) onProgress(done, total); };
  for (const [name, d0] of Object.entries(W.textures)) {
    const d = typeof d0 === 'string' ? { file: d0 } : d0, file = (lo && d.lo) || d.file;
    jobs.push(new Promise((res) => tl.load(Assets.base + file, (t) => {
      t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = lo ? 2 : 8;
      t.colorSpace = d.srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      Assets.tex[name] = t; tick(); res();
    }, undefined, () => { Assets.failed.push(file); tick(); res(); })));
  }
  for (const [name, d0] of Object.entries(W.models)) {
    const d = typeof d0 === 'string' ? { file: d0 } : d0, file = (lo && d.lo) || d.file;
    jobs.push(new Promise((res) => gl.load(Assets.base + file, (g) => {
      g.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      Assets.models[name] = g; tick(); res();
    }, undefined, () => { Assets.failed.push(file); tick(); res(); })));
  }
  await Promise.all(jobs);
  if (Assets.failed.length) console.warn('assets missing (procedural fallback used):', Assets.failed.join(', '));
  Assets.ready = true;
};

// ---------------- PBR helpers
// pbrSet('rock_a') expects textures rock_a_albedo (srgb), rock_a_normal, rock_a_orm (r=AO g=roughness b=height) registered
function pbrSet(name) {
  const a = assetTex(name + '_albedo'), n = assetTex(name + '_normal'), o = assetTex(name + '_orm');
  return a ? { albedo: a, normal: n, orm: o } : null;
}
// Triplanar PBR: patches a MeshStandardMaterial so map / normalMap / roughness come from world-space triplanar
// projection (no UVs needed: terrain cliffs, sculpted rocks, dragons). scale = texture repeats per world unit.
function triplanarPBR(mat, set, scale = 0.25, opts = {}) {
  if (!set) return mat;
  const U = { tpA: { value: set.albedo }, tpN: { value: set.normal }, tpO: { value: set.orm }, tpScale: { value: scale },
    tpNormStr: { value: opts.normalStrength ?? 1 }, tpTint: { value: new THREE.Color(opts.tint ?? 0xffffff) }, tpRough: { value: opts.roughness ?? 1 } };
  mat.userData.tp = U;
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = (sh, r) => {
    if (prev) prev(sh, r);
    Object.assign(sh.uniforms, U);
    sh.vertexShader = 'varying vec3 tpW; varying vec3 tpNw;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
      tpW = (modelMatrix * vec4(transformed, 1.0)).xyz; tpNw = normalize(mat3(modelMatrix) * objectNormal);`);
    sh.fragmentShader = `uniform sampler2D tpA, tpN, tpO; uniform float tpScale, tpNormStr, tpRough; uniform vec3 tpTint; varying vec3 tpW; varying vec3 tpNw;
      vec3 tpBlend(vec3 n){ vec3 b = pow(abs(n), vec3(4.0)); return b / (b.x + b.y + b.z + 1e-4); }
      vec4 tpSample(sampler2D t, vec3 p, vec3 b){ return texture2D(t, p.zy) * b.x + texture2D(t, p.xz) * b.y + texture2D(t, p.xy) * b.z; }
      // whiteout-blended triplanar normal mapping (world space), after Ben Golus
      vec3 tpNormal(vec3 p, vec3 n, vec3 b){
        vec3 tx = texture2D(tpN, p.zy).xyz * 2.0 - 1.0, ty = texture2D(tpN, p.xz).xyz * 2.0 - 1.0, tz = texture2D(tpN, p.xy).xyz * 2.0 - 1.0;
        tx.xy *= tpNormStr; ty.xy *= tpNormStr; tz.xy *= tpNormStr;
        tx = vec3(tx.xy + n.zy, abs(tx.z) * n.x);
        ty = vec3(ty.xy + n.xz, abs(ty.z) * n.y);
        tz = vec3(tz.xy + n.xy, abs(tz.z) * n.z);
        return normalize(tx.zyx * b.x + ty.xzy * b.y + tz.xyz * b.z);
      }
      ` + sh.fragmentShader
      .replace('#include <map_fragment>', `
        vec3 tpP = tpW * tpScale, tpB = tpBlend(normalize(tpNw));
        vec4 tpAl = tpSample(tpA, tpP, tpB);
        diffuseColor.rgb *= tpAl.rgb * tpTint;
        vec4 tpOrm = tpSample(tpO, tpP, tpB);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor *= mix(1.0, tpOrm.g * 1.25, step(0.001, tpOrm.g + tpOrm.r)) * tpRough;`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        {
          vec3 wn = tpNormal(tpP, normalize(tpNw), tpB);
          normal = normalize((viewMatrix * vec4(wn, 0.0)).xyz);
        }`)
      .replace('#include <aomap_fragment>', `#include <aomap_fragment>
        reflectedLight.indirectDiffuse *= mix(1.0, tpOrm.r, 0.85);`);
  };
  const k = mat.customProgramCacheKey ? mat.customProgramCacheKey() : '';
  mat.customProgramCacheKey = () => k + '|tp';
  mat.needsUpdate = true;
  return mat;
}

// ---------- motes used by both legends
function motes(r, parent, n, color, radius, ysp, toCenter = false) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3), ph = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, rr = radius * (0.5 + Math.random() * 0.6);
    pos[i * 3] = Math.cos(a) * rr; pos[i * 3 + 1] = (Math.random() - 0.5) * ysp; pos[i * 3 + 2] = Math.sin(a) * rr; ph[i] = Math.random();
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('ph', new THREE.BufferAttribute(ph, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: Shared.time, uColor: { value: new THREE.Color(color).multiplyScalar(2.6) }, uTex: { value: TEX.dot }, uIn: { value: toCenter ? 1 : 0 } },
    vertexShader: `attribute float ph; uniform float uTime; uniform float uIn; varying float vA;
      void main(){ vec3 p = position; float k = fract(uTime*0.35 + ph);
        if(uIn > 0.5){ p = mix(p, vec3(0.0), k); vA = sin(k*3.14159); }
        else { float a = uTime*(0.3+ph*0.4); float c=cos(a), s=sin(a); p.xz = mat2(c,-s,s,c)*p.xz; p.y += sin(uTime*1.3+ph*20.0)*0.15; vA = 0.55+0.45*sin(uTime*3.0+ph*30.0); }
        vec4 mv = modelViewMatrix*vec4(p,1.0); gl_PointSize = (0.9+ph)*70.0/-mv.z; gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform vec3 uColor; uniform sampler2D uTex; varying float vA;
      void main(){ float a = texture2D(uTex, gl_PointCoord).a * vA; gl_FragColor = vec4(uColor*a, 1.0); }`,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
  });
  const p = new THREE.Points(g, m); p.frustumCulled = false; parent.add(p); return p;
}

// ---------- shared helpers for the legends
function beamBetween(parent, a, b, mat, rad = 0.012) {
  const A = new THREE.Vector3(...a), Bv = new THREE.Vector3(...b), d = Bv.clone().sub(A), L = d.length();
  const m = new THREE.Mesh(GEO.cyl, mat); m.position.copy(A).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); m.scale.set(rad, L, rad);
  parent.add(m); return m;
}
// a body you can look *into*: screen-space starfield + drifting nebula + rim light
function cosmicMat(rim = 0x8fe0ff, deep = 0x060a24, neb = 0x4a3a9a, neb2 = 0x1a6aa8) {
  const k = 'c' + rim + '_' + deep + '_' + neb;
  if (_mc.has(k)) { _mc.get(k).uniforms.uPx.value = renderer.getPixelRatio(); return _mc.get(k); }
  const m = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uRim: { value: new THREE.Color(rim).multiplyScalar(2.3) }, uDeep: { value: new THREE.Color(deep) }, uNeb: { value: new THREE.Color(neb) }, uNeb2: { value: new THREE.Color(neb2) }, uPx: { value: renderer.getPixelRatio() }, uTime: { value: 0 } }]),
    vertexShader: `varying vec3 vN; varying vec3 vV; ${FOG_V}
      void main(){ vec4 mvPosition = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mvPosition.xyz);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `uniform vec3 uRim, uDeep, uNeb, uNeb2; uniform float uTime, uPx; varying vec3 vN; varying vec3 vV;
      ${GLSL_NOISE}
      ${FOG_F}
      void main(){
        vec2 fc = gl_FragCoord.xy / uPx;
        float h = hash12(floor(fc / 3.0));
        float star = step(0.978, h) * smoothstep(0.55, 0.0, length(fract(fc / 3.0) - 0.5)) * (0.5 + 0.5 * sin(uTime * 2.4 + h * 90.0));
        float hb = hash12(floor(fc / 11.0) + 7.0);
        float big = step(0.993, hb) * smoothstep(0.5, 0.0, length(fract(fc / 11.0) - 0.5));
        vec2 q = fc * 0.0035 + vec2(uTime * 0.012, uTime * 0.004);
        float n = vnoise(q * 3.0) * 0.6 + vnoise(q * 7.0 + 3.0) * 0.4;
        vec3 col = mix(uDeep, uNeb, smoothstep(0.42, 0.85, n));
        col = mix(col, uNeb2, smoothstep(0.55, 0.95, vnoise(q * 4.0 + 9.0)) * 0.65);
        col += vec3(1.7) * star + vec3(1.3, 1.6, 2.4) * big * 1.8;
        float fr = pow(1.0 - max(dot(normalize(vN), normalize(vV)), 0.0), 2.3);
        col += uRim * fr;
        gl_FragColor = vec4(col, 1.0);
        #include <fog_fragment>
      }`,
    fog: true,
  });
  m.uniforms.uTime = Shared.time;
  _mc.set(k, m); return m;
}

// ---------- portrait icons (offscreen renderer, cached data URLs)
const Icons = {

    const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(2, 3, 4); this.scene.add(d);
    const rim = new THREE.DirectionalLight(0xbcd4ff, 1.4); rim.position.set(-3, 2, -2); this.scene.add(rim);
    this.cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);

      rigUpdate(r, 0.01);

// Catmull-Rom through control points → dense list of {p, r, s}
function spinePath(pts, radii, sub = 4) {

const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// JS mirror of the vertex deformation so attachments (eyes, halo, pearl…) stay glued to the body
function dragonOffset(U, s, t) {
  const tailW = 1 - sstep(0, U.uTailStart.value, s);
  const amp = U.uWaveAmp.value * (tailW * tailW + U.uSerp.value * (0.4 + 0.6 * (1 - s)));
  const ph = t * U.uWaveSpeed.value - s * U.uWaveFreq.value;

// ---------------------------------------------------------------- build-time bake: SDF ambient occlusion, curvature, thickness
// Per vertex, in object space before any deformation, from the sculpt's own distance grid (no ray tracing, ~0.1 s):
//   x  occlusion (0 open … 1 buried) — a cone of 7 rays (normal + 6 tilted 50°) marched through the SDF, each step
//      compared with what a flat open surface would read, so only real creases, cavities and contacts darken
//   y  mean curvature (−1 cavity … +1 sharp ridge) — normal divergence along mesh edges, smoothed, squashed
//   z  thinness (0 thick … 1 paper thin) — inscribed radius found by marching inward along −n (ears, fins, frills)
// Every channel is 0 where nothing is baked, so materials on unbaked geometry look exactly like before.
function bakeSculpt(m, opt = {}) {
  const { pos, nor, idx, nv, sample } = m;
  const R = opt.aoR || 0.2, tMax = opt.thickMax || R * 3, tRef = opt.thinRef || R * 0.9;
  const out = new Float32Array(nv * 3);
  const steps = [0.12, 0.28, 0.55, 1.0].map((k) => k * R), sw = [1.0, 0.8, 0.6, 0.45];
  let swSum = 0; for (const w of sw) swSum += w;
  const tilt = 0.87, ct = Math.cos(tilt), st = Math.sin(tilt);
  const D = [[0, 0]]; for (let i = 0; i < 6; i++) D.push([Math.cos(i * Math.PI / 3 + 0.3), Math.sin(i * Math.PI / 3 + 0.3)]);
  const ao = new Float32Array(nv), thick = new Float32Array(nv);
  for (let q = 0; q < nv; q++) {
    const px = pos[q * 3], py = pos[q * 3 + 1], pz = pos[q * 3 + 2], nx = nor[q * 3], ny = nor[q * 3 + 1], nz = nor[q * 3 + 2];
    let tx, ty, tz; if (Math.abs(ny) < 0.9) { tx = nz; ty = 0; tz = -nx; } else { tx = 0; ty = -nz; tz = ny; }
    const l = Math.hypot(tx, ty, tz) || 1; tx /= l; ty /= l; tz /= l;
    const bx = ny * tz - nz * ty, by = nz * tx - nx * tz, bz = nx * ty - ny * tx;
    let occ = 0, wsum = 0;
    for (let d = 0; d < D.length; d++) {
      const ca = D[d][0], sa = D[d][1];
      let dx, dy, dz, cosn;
      if (d === 0) { dx = nx; dy = ny; dz = nz; cosn = 1; }
      else { dx = nx * ct + (tx * ca + bx * sa) * st; dy = ny * ct + (ty * ca + by * sa) * st; dz = nz * ct + (tz * ca + bz * sa) * st; cosn = ct; }
      const dw = d === 0 ? 1.5 : 1;
      for (let k = 0; k < steps.length; k++) {
        const s = steps[k], f = sample(px + dx * s, py + dy * s, pz + dz * s);
        const o = (s * cosn - f) / s;
        occ += (o > 1 ? 1 : o > 0 ? o : 0) * sw[k] * dw;
      }
      wsum += swSum * dw;
    }
    ao[q] = occ / wsum;
    let best = 0;
    for (let t = R * 0.06; t <= tMax; t *= 1.45) {
      const f = -sample(px - nx * t, py - ny * t, pz - nz * t);
      if (f > best) best = f;
      if (f < best * 0.5 && t > best * 2.2) break;
    }
    thick[q] = best;
  }
  // curvature from normal divergence along edges
  const acc = new Float32Array(nv), cnt = new Float32Array(nv);
  const edge = (i, j) => {
    const ex = pos[j * 3] - pos[i * 3], ey = pos[j * 3 + 1] - pos[i * 3 + 1], ez = pos[j * 3 + 2] - pos[i * 3 + 2];
    const l2 = ex * ex + ey * ey + ez * ez; if (l2 < 1e-12) return;
    const k = ((nor[j * 3] - nor[i * 3]) * ex + (nor[j * 3 + 1] - nor[i * 3 + 1]) * ey + (nor[j * 3 + 2] - nor[i * 3 + 2]) * ez) / l2;
    acc[i] += k; acc[j] += k; cnt[i]++; cnt[j]++;
  };
  for (let t = 0; t < idx.length; t += 3) { const a = idx[t], b = idx[t + 1], c = idx[t + 2]; edge(a, b); edge(b, c); edge(c, a); }
  const curv = new Float32Array(nv);
  for (let q = 0; q < nv; q++) curv[q] = cnt[q] ? acc[q] / cnt[q] : 0;
  // smoothing (surface-nets vertices are slightly irregular): curvature twice, AO and thickness once
  for (let pass = 0; pass < 2; pass++) {
    const sc = new Float32Array(nv), sa = new Float32Array(nv), sth = new Float32Array(nv), n = new Float32Array(nv);
    for (let t = 0; t < idx.length; t += 3) for (let e = 0; e < 3; e++) {
      const i = idx[t + e], j = idx[t + (e + 1) % 3];
      sc[i] += curv[j]; sc[j] += curv[i]; sa[i] += ao[j]; sa[j] += ao[i]; sth[i] += thick[j]; sth[j] += thick[i]; n[i]++; n[j]++;
    }
    for (let q = 0; q < nv; q++) if (n[q]) {
      curv[q] = (curv[q] + sc[q] / n[q]) * 0.5;
      if (pass === 0) { ao[q] = (ao[q] * 2 + sa[q] / n[q]) / 3; thick[q] = (thick[q] + sth[q] / n[q]) * 0.5; }
    }
  }
  const cs = R * 0.22;
  for (let q = 0; q < nv; q++) {
    out[q * 3] = Math.min(1, Math.max(0, ao[q] * 1.85));
    out[q * 3 + 1] = Math.tanh(curv[q] * cs);
    out[q * 3 + 2] = Math.min(1, Math.max(0, 1 - thick[q] / tRef));
  }
  return out;
}

// ============================================================================
//  critters: sculpted (signed-distance) bodies for every regular spirit,

    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uIris: { value: new THREE.Color(iris) }, uIris2: { value: new THREE.Color(iris2) } }]),
    vertexShader: `varying vec3 vN; ${FOG_V}

}

// ---------------------------------------------------------------- critter eye
// Only the lens-shaped opening (plus the lash line) of the eye sphere is drawn; everything else is cut away with
// alpha-to-coverage so the sculpted face (with its carved socket) shows through. The iris lies on a plane behind a
// refracting cornea (parallax: the eye reads as a wet, deep ball) and rotates with the gaze (see eyeGaze in 02d);
// catch-lights come from one view-space key light, so both eyes agree. Lids: blink lowers a skin-coloured upper lid
// over the eyeball into a "‿" lash curve, a happy squint raises the lower lid into an arch, a hit squeezes them shut.

  const U = {
    uIris: { value: new THREE.Color(o.iris ?? 0x2a1a4a) }, uIris2: { value: new THREE.Color(o.iris2 ?? 0x8a6aff) },
    uLash: { value: new THREE.Color(o.lash ?? 0x1c1018) }, uBlink: { value: 0 }, uSide: { value: o.side ?? 1 },
    // x: opening half-height, y: outer-corner lift, z: lash wing, w: iris radius

    uGlow: { value: o.glow ?? 0 }, uSlit: { value: o.slit ?? 0 }, uFlash: { value: 0 },
    uGaze: { value: new THREE.Vector2() }, uExpr: { value: new THREE.Vector2() }, uSkin: { value: new THREE.Color(o.skin ?? 0xd8c8c0) },
    uPupil: { value: o.pupil ?? 1 }, uDepth: { value: o.cornea ?? 0.42 },

    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog]),

    fragmentShader: `uniform vec3 uIris, uIris2, uLash, uSkin; uniform float uBlink, uSide, uGlow, uSlit, uFlash, uPupil, uDepth; uniform vec4 uShape; uniform vec2 uGaze, uExpr; ${EYE_F} ${FOG_F}

// ---- exact sculpt field (same smooth union / subtraction order as sculptMesh), culled per 8 cm bucket
function spiritField(prims, bounds) {

  const nx = Math.ceil((bounds[3] - x0 + pad) / B) + 1, ny = Math.ceil((bounds[4] - y0 + pad) / B) + 1, nz = Math.ceil((bounds[5] - z0 + pad) / B) + 1;
  const cells = new Array(nx * ny * nz);
  const ci = (v, o, n) => Math.min(n - 1, Math.max(0, Math.floor((v - o) / B)));
  prims.forEach((P, pi) => {
    const bb = SDF.aabb(P);
    for (let k = ci(bb[2], z0, nz), k1 = ci(bb[5], z0, nz); k <= k1; k++) for (let j = ci(bb[1], y0, ny), j1 = ci(bb[4], y0, ny); j <= j1; j++) for (let i = ci(bb[0], x0, nx), i1 = ci(bb[3], x0, nx); i <= i1; i++) {
      const c = (k * ny + j) * nx + i; (cells[c] || (cells[c] = [])).push(pi);
    }
  });

    const L = cells[(ci(z, z0, nz) * ny + ci(y, y0, ny)) * nx + ci(x, x0, nx)];
    if (!L) return 0.5;
    let g = 1e3;
    for (let q = 0; q < L.length; q++) {
      const P = prims[L[q]], d = SDF.dist(P, x, y, z), k = P.k;
      if (P.sub) { const h = Math.max(k - Math.abs(-d - g), 0) / k; g = Math.max(g, -d) + h * h * k * 0.25; }
      else if (d < g + k) { const h = Math.max(k - Math.abs(g - d), 0) / k; g = Math.min(g, d) - h * h * k * 0.25; }
    }

  };
}

// ---- clean geometry: smoothing + exact projection + relaxation, exact normals, region distances, soft crease AO
const _spiritGeo = {};
function spiritGeometry(key, D, look) {

      if (tang) { const dn = dx * nor[i3] + dy * nor[i3 + 1] + dz * nor[i3 + 2]; dx -= dn * nor[i3]; dy -= dn * nor[i3 + 1]; dz -= dn * nor[i3 + 2]; }

// palette slots: classes (one per distinct prim colour, stored as distance above the nearest class) followed by
// overlays (signed distance). Returns the attributes, a hard per-vertex colour (outline ink) and the slot table.
function spiritRegions(D, look, pos, nor, nv, m) {

  const over = (look.over || []).slice(0, Math.max(0, SPIRIT_SLOTS - Math.min(hexes.length, SPIRIT_SLOTS)));

    if (i < nc) return i;

  });

  for (let i = 0; i < nv; i++) {
    const x = pos[i * 3], y = pos[i * 3 + 1], z = pos[i * 3 + 2];
    dc.fill(1e9);
    for (let p = 0; p < add.length; p++) {
      const b = boxes[p];
      if (x < b[0] - 0.2 || y < b[1] - 0.2 || z < b[2] - 0.2 || x > b[3] + 0.2 || y > b[4] + 0.2 || z > b[5] + 0.2) continue;

    for (let o = 0; o < over.length; o++) {

    const p = o.mat ? mp(o.mat).slice() : [0, -1, 0, 0];

// ---- the cel material
const SPIRIT_DECL = `uniform vec3 uPal[${SPIRIT_SLOTS}]; uniform vec4 uPalP[${SPIRIT_SLOTS}]; uniform float uPalS[${SPIRIT_SLOTS}]; uniform int uNC, uNS;
  uniform float uShade, uShadeSat, uMid, uMidW, uRim, uRimT, uTerm, uAOk, uAOs, uForm, uAmbHue, uKeyK, uAmbK, uFlash;
  uniform vec3 uShadeTint, uMidTint;

    Fw[0] = f0.x; Fw[1] = f0.y; Fw[2] = f0.z; Fw[3] = f0.w; Fw[4] = f1.x; Fw[5] = f1.y; Fw[6] = f1.z; Fw[7] = f1.w; Fw[8] = f2.x; Fw[9] = f2.y; Fw[10] = f2.z; Fw[11] = f2.w;
    float dm = 1.0;
    for (int i = 0; i < ${SPIRIT_SLOTS}; i++) { if (i < uNC) dm = min(dm, Dv[i]); }
    vec3 c = vec3(0.0); vec4 pp = vec4(0.0); float ws = 0.0;
    for (int i = 0; i < ${SPIRIT_SLOTS}; i++) {
      if (i < uNC) {

        c += uPal[i] * w; pp += uPalP[i] * w; ws += w;

// ---- 02g_people.js ----
// ============================================================================
//  people: stylized-realistic characters (adults 6.5–7 heads, kid ≈ 4.3) on a real skeleton
//  · every garment is its own sculpted SDF layer (crisp colour / material edges, real hems and overlaps), Taubin-
//    smoothed and skinned to a 21-bone rig with capsule weights; head, hands and accessories ride their bones rigidly
//  · faces with volume (brow ridge, cheekbones, nose bridge, lips, jaw, ears); eyes sit in carved sockets under real
//    lid shells (lash line, crease, lid shadow), irises with fibres / limbal ring / caustic seen through the cornea,
//    one shared catch-light direction, converging gaze with saccades, 120–150 ms blinks (sometimes double)
//  · hair = swept lens-section clumps grown over the scalp (bangs, sides, nape, long locks on a spring bone)
//  · own cel shading: two tones + narrow form band with an antialiased terminator, hue-shifted shade, skin scatter at
//    the terminator, shaped specular (leather / metal / lips), anisotropic hair sheen, cloth fresnel sheen, clean
//    sun-side rim, very soft baked crease AO; screen-space ink outline coloured from the albedo
//  · procedural animation: breathing, weight shift, look-at (head + eyes), walk → run → sprint with arm swing, knee
//    and foot roll, pelvis bob / yaw / roll, lean, hair spring, cloth tails
//  buildPerson(look) keeps the old look options (skin hair top shirt trim bottom shoe glove accent robe beard long pack
//  kid hat pin staff pendant eye eye2) and sets r.size and r.headY (head centre height above the feet).
// ============================================================================
const ppV = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: (a) => Math.hypot(a[0], a[1], a[2]),
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
};
const _ppC = new THREE.Color();
const ppLin = (h) => { _ppC.set(h); return [_ppC.r, _ppC.g, _ppC.b]; };
const ppHex = (c) => { _ppC.setRGB(c[0], c[1], c[2]); return _ppC.getHex(); };
const ppMixC = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
// surface response per material: [specular, gloss, skin scatter, hair sheen]
const PP_M = { skin: [0.2, 0.3, 1, 0], lip: [0.42, 0.5, 1, 0], cloth: [0, 0, 0, 0], satin: [0.1, 0.05, 0, 0], leather: [0.4, 0.5, 0, 0], metal: [1, 0.8, 0, 0], hair: [0, 0, 0, 1], wood: [0.12, 0.2, 0, 0], ink: [0, 0, 0, 0] };
const PP_HI = () => Settings.high && !isTouch;

// ---------------------------------------------------------------- sculpt: SDF field → surface nets (no attributes)
