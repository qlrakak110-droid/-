<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>존재와 공허</title>
<meta name="theme-color" content="#07060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one full-bleed WebGL stage; every overlay is a floating glass panel pinned to a safe-area-aware edge.
   Duality palette: gold = 존재 (Being), violet = 공허 (Void). Single dark world by design. */
:root{
  color-scheme: dark;
  --ink:#07060c;
  --panel:rgba(14,11,26,.80);
  --panel-hi:rgba(30,24,52,.92);
  --line:rgba(226,212,255,.16);
  --line-hi:rgba(242,212,138,.55);
  --text:#efeaf9;
  --muted:#a69dc2;
  --gold:#f2d48a;
  --gold-hi:#fff0c4;
  --void:#b06bff;
  --void-deep:#5a2bb8;
  --hp-good:#5fe08c;
  --hp-mid:#f2c94c;
  --hp-low:#ff5a6a;
  --xp:#71b9ff;
  --f-display:'Gowun Batang','Noto Serif KR','AppleMyungjo','Batang',serif;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  --sa-t:env(safe-area-inset-top,0px);
  --sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px);
  --sa-r:env(safe-area-inset-right,0px);
  --edge:16px;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30}

/* ---------- loading ---------- */
#loading{background:radial-gradient(ellipse at 50% 45%,#1a1230 0%,#07060c 65%);gap:22px}
.load-mark{width:64px;height:64px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 50%,#000 0 38%,transparent 39%),conic-gradient(from 0deg,var(--gold),var(--void),var(--gold));
  animation:spin 2.4s linear infinite;box-shadow:0 0 40px rgba(176,107,255,.45)}
@keyframes spin{to{transform:rotate(360deg)}}
#loadMsg{font-family:var(--f-display);color:var(--muted);letter-spacing:.08em;margin:0;text-align:center;padding:0 var(--edge)}

/* ---------- title ---------- */
#title{background:linear-gradient(180deg,rgba(7,6,12,.0) 0%,rgba(7,6,12,.15) 55%,rgba(7,6,12,.85) 100%);justify-content:flex-end;
  padding:calc(var(--sa-t) + 24px) max(var(--edge),var(--sa-r)) calc(var(--sa-b) + 28px) max(var(--edge),var(--sa-l))}
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:640px}
.eyebrow{margin:0;font-family:var(--f-display);font-size:15px;letter-spacing:.6em;text-indent:.6em;color:var(--muted)}
.logo{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(54px,13vw,112px);line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:.08em}
.logo .being{background:linear-gradient(180deg,#fffaf0 0%,var(--gold) 55%,#b98a3a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(242,212,138,.55))}
.logo .and{font-size:.38em;color:var(--muted);font-weight:400;padding:0 .1em}
.logo .void{background:linear-gradient(180deg,#e9d6ff 0%,var(--void) 50%,#2a0f5c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(176,107,255,.7))}
.tag{margin:0;color:#d6cfe8;font-family:var(--f-display);font-size:16px;line-height:1.7;text-wrap:balance}
.title-btns{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.title-opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.credit{margin:18px 0 0;color:var(--muted);font-size:12px;text-align:center;letter-spacing:.02em}

.btn{border:1px solid var(--line);background:var(--panel);padding:14px 30px;border-radius:999px;font-weight:700;font-size:16px;letter-spacing:.04em;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s,border-color .15s,background .15s;min-height:48px}
.btn:hover{transform:translateY(-1px);border-color:var(--line-hi)}
.btn.primary{background:linear-gradient(180deg,#fff2c9,#e7c068);color:#2a1b05;border-color:transparent;box-shadow:0 8px 30px rgba(242,212,138,.35)}
.btn.void{background:linear-gradient(180deg,#c99bff,#7a3fe0);color:#12051f;border-color:transparent;box-shadow:0 8px 30px rgba(176,107,255,.4)}
.chip{border:1px solid var(--line);background:rgba(14,11,26,.6);padding:7px 14px;border-radius:999px;font-size:13px;color:#d9d2ec;min-height:34px}
.chip:hover{border-color:var(--line-hi)}

/* ---------- lore ---------- */
#lore{background:rgba(4,3,8,.55);padding:0 max(24px,var(--sa-l))}
#loreText{font-family:var(--f-display);font-size:clamp(19px,4.6vw,30px);line-height:1.75;text-align:center;max-width:760px;margin:0;text-wrap:balance;
  transition:opacity .9s ease;text-shadow:0 2px 24px rgba(0,0,0,.8)}
#loreText b.g{color:var(--gold);font-weight:700}
#loreText b.v{color:var(--void);font-weight:700}
#loreSkip{position:absolute;right:max(var(--edge),var(--sa-r));bottom:calc(var(--sa-b) + 20px)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#quest{position:absolute;left:max(var(--edge),var(--sa-l));top:calc(var(--sa-t) + 14px);max-width:min(62vw,420px);
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:3px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.q-label{font-size:11px;letter-spacing:.24em;color:var(--gold);font-weight:700}
#questText{font-family:var(--f-display);font-size:15px;line-height:1.45}
#questSub{font-size:12px;color:var(--muted)}
#hudBtns{position:absolute;right:max(var(--edge),var(--sa-r));top:calc(var(--sa-t) + 14px);display:flex;gap:8px;pointer-events:auto}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:700;min-height:40px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ibtn:hover{border-color:var(--line-hi)}
#prompt{position:absolute;left:50%;bottom:calc(var(--sa-b) + 34%);transform:translateX(-50%);background:var(--panel-hi);border:1px solid var(--line-hi);
  padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 0 30px rgba(242,212,138,.25)}
#prompt kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--gold);color:#241603;font-family:var(--f-ui);font-size:12px;margin-right:8px;padding:0 5px}
#leadCard{position:absolute;left:max(var(--edge),var(--sa-l));bottom:calc(var(--sa-b) + 16px);display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;min-width:200px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#leadCard img{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.05)}
#leadCard .lc-body{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
#leadCard .lc-name{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
#leadCard .lc-name span{color:var(--muted);font-weight:500;font-size:12px;font-variant-numeric:tabular-nums}
.has-touch #leadCard{left:50%;transform:translateX(-50%);bottom:calc(var(--sa-b) + 12px);min-width:170px;padding:6px 10px 6px 6px}
.has-touch #leadCard img{width:34px;height:34px}

.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.bar > i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--hp-good);transition:width .35s ease,background-color .35s}
.bar.xp{height:4px}
.bar.xp > i{background:var(--xp)}

/* ---------- touch ---------- */
#touch{position:absolute;inset:0;pointer-events:none;z-index:12}
#stick{position:absolute;left:max(22px,var(--sa-l));bottom:calc(var(--sa-b) + 70px);width:128px;height:128px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(242,212,138,.25);border:1px solid var(--line-hi)}
#tA{position:absolute;right:max(22px,var(--sa-r));bottom:calc(var(--sa-b) + 96px);width:76px;height:76px;border-radius:50%;border:1px solid var(--line-hi);
  background:radial-gradient(circle at 40% 35%,rgba(255,240,196,.35),rgba(242,212,138,.12));font-weight:700;font-size:22px;pointer-events:auto;color:var(--gold-hi)}
#tRun{position:absolute;right:max(110px,calc(var(--sa-r) + 110px));bottom:calc(var(--sa-b) + 70px);width:62px;height:62px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);font-size:12px;font-weight:700;pointer-events:auto}
#tRun.on{border-color:var(--line-hi);color:var(--gold)}

/* ---------- dialog ---------- */
#dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sa-b) + 18px);width:min(760px,calc(100% - 2*var(--edge) - var(--sa-l) - var(--sa-r)));
  background:linear-gradient(180deg,rgba(24,19,42,.94),rgba(12,9,22,.96));border:1px solid var(--line);border-radius:18px;padding:16px 20px 18px;z-index:20;
  box-shadow:0 20px 60px rgba(0,0,0,.55);cursor:pointer;min-height:96px}
#dialog::before{content:"";position:absolute;left:20px;right:20px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),var(--void),transparent)}
#dWho{font-family:var(--f-display);font-weight:700;color:var(--gold);font-size:15px;margin-bottom:6px;letter-spacing:.04em}
#dWho.void{color:var(--void)}
#dWho:empty{display:none}
#dTxt{font-family:var(--f-display);font-size:17px;line-height:1.7;white-space:pre-wrap;min-height:1.7em}
#dialog .next{position:absolute;right:18px;bottom:10px;color:var(--gold);font-size:12px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#dChoices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#dChoices:empty{display:none}
#dChoices button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
#dChoices button:hover,#dChoices button:focus-visible{border-color:var(--line-hi);background:rgba(242,212,138,.12)}

/* ---------- starter select ---------- */
#select{position:absolute;inset:0;z-index:15;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding:0 max(var(--edge),var(--sa-r)) calc(var(--sa-b) + 20px) max(var(--edge),var(--sa-l))}
.sel-card{pointer-events:auto;width:min(560px,100%);background:var(--panel-hi);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.sel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sel-head h3{margin:0;font-family:var(--f-display);font-size:26px}
.sel-desc{margin:0;color:#d4cce6;font-family:var(--f-display);line-height:1.65;font-size:15px}
.sel-row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.sel-nav{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:18px}
.sel-stats{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;font-size:12px;color:var(--muted);align-items:center;font-variant-numeric:tabular-nums}

.type{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.03em;color:#160f22;white-space:nowrap}

/* ---------- battle ---------- */
#battleUI{position:absolute;inset:0;z-index:11;pointer-events:none}
.bp{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px 12px;width:min(320px,calc(50vw - 24px));
  display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .3s,transform .3s}
.bp.foe{left:max(var(--edge),var(--sa-l));top:calc(var(--sa-t) + 14px)}
.bp.ally{right:max(var(--edge),var(--sa-r));bottom:calc(var(--sa-b) + 190px)}
.bp.off{opacity:0;transform:translateY(-8px)}
.listing .bp.ally{opacity:0;pointer-events:none}
.bp .bp-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bp .nm{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp .lv{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bp .types{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.bp .st{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#ff8a4c;color:#2a0e00}
.bp .st.para{background:#ffd23f;color:#2a2000}
.bp .hpline{display:flex;align-items:center;gap:8px}
.bp .hpline .bar{flex:1;height:9px}
.bp .hpline b{font-size:11px;color:var(--muted);letter-spacing:.1em}
.bp .hpnum{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bp.legend{border-color:rgba(176,107,255,.55);box-shadow:0 0 34px rgba(176,107,255,.25)}
.bp.legend.being{border-color:rgba(242,212,138,.6);box-shadow:0 0 34px rgba(242,212,138,.25)}
.party-dots{display:flex;gap:4px}
.party-dots i{width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:.9}
.party-dots i.out{background:#4a4360}

#bBox{position:absolute;left:max(var(--edge),var(--sa-l));right:max(var(--edge),var(--sa-r));bottom:calc(var(--sa-b) + 14px);display:flex;gap:12px;align-items:stretch;pointer-events:auto}
#bMsg{flex:1;min-width:0;background:linear-gradient(180deg,rgba(24,19,42,.94),rgba(12,9,22,.96));border:1px solid var(--line);border-radius:16px;padding:14px 18px;
  font-family:var(--f-display);font-size:17px;line-height:1.6;min-height:84px;display:flex;align-items:center;white-space:pre-wrap}
#bCmd{width:min(430px,48vw);display:grid;grid-template-columns:1fr 1fr;gap:8px}
#bCmd:empty{display:none}
.cmd{border:1px solid var(--line);background:var(--panel-hi);border-radius:14px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:56px;
  transition:border-color .15s,transform .12s,background .15s}
.cmd:hover:not(:disabled),.cmd:focus-visible{border-color:var(--line-hi);transform:translateY(-1px)}
.cmd:disabled{opacity:.4;cursor:default}
.cmd .c-t{font-weight:700;font-size:15px}
.cmd .c-s{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cmd.mv{border-left-width:4px}
.cmd.back{grid-column:1 / -1;min-height:40px;text-align:center;align-items:center}
.cmd.list{grid-column:1 / -1;flex-direction:row;align-items:center;gap:10px}
.cmd.list img{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.05)}
.cmd.list .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
#bCmd.scroll{max-height:46vh;overflow:auto;align-content:start}

#pops{position:absolute;inset:0;pointer-events:none;z-index:13}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:26px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 18px rgba(0,0,0,.6);
  animation:popUp 1.1s ease-out forwards;white-space:nowrap;font-variant-numeric:tabular-nums}
.pop.big{font-size:34px;color:#ffe08a}
.pop.weak{font-size:20px;color:#b8b0d0}
.pop.heal{color:#7dffa8}
.pop small{display:block;font-size:13px;text-align:center;letter-spacing:.08em}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-160%)}}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:25;background:rgba(5,4,10,.6);display:flex;align-items:center;justify-content:center;
  padding:calc(var(--sa-t) + 16px) max(var(--edge),var(--sa-r)) calc(var(--sa-b) + 16px) max(var(--edge),var(--sa-l));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal-card{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(26,20,46,.97),rgba(12,9,22,.98));
  border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-card header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal-card h2{margin:0;font-family:var(--f-display);font-size:20px}
#mTabs{display:flex;gap:6px;padding:10px 18px 0;flex-wrap:wrap}
#mTabs:empty{display:none}
#mTabs button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--muted)}
#mTabs button.on{color:#241603;background:var(--gold);border-color:transparent}
#mBody{overflow:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.mon-row{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(255,255,255,.02);text-align:left;width:100%}
.mon-row:hover,.mon-row.sel{border-color:var(--line-hi)}
.mon-row img{width:56px;height:56px;border-radius:12px;background:rgba(255,255,255,.05);flex:none}
.mon-row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mon-row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mon-row .top b{font-family:var(--f-display);font-size:17px}
.mon-row .top span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mon-row .badge{font-size:10px;font-weight:700;color:#241603;background:var(--gold);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}
.detail{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.02)}
.detail p{margin:0;font-family:var(--f-display);color:#d4cce6;line-height:1.65}
.detail .moves{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.detail .moves div{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.detail .acts{display:flex;gap:8px;flex-wrap:wrap}
.section-h{font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:700;margin:6px 0 0}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.dex div{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-align:center}
.dex img{width:72px;height:72px}
.dex .no{color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.dex .sil img{filter:brightness(0) opacity(.55)}
.dex .unk{height:72px;width:72px;display:grid;place-items:center;color:#4a4360;font-size:28px}
.item-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.item-row .nm{font-weight:700}
.item-row .ds{font-size:12px;color:var(--muted);margin-top:3px}
.item-row .ct{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}

/* ---------- overlays ---------- */
#toasts{position:absolute;top:calc(var(--sa-t) + 84px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:28;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{background:var(--panel-hi);border:1px solid var(--line-hi);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;animation:toast 3.2s ease forwards;text-align:center}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .6s ease}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:41}
#wipe{position:absolute;inset:0;pointer-events:none;z-index:39;opacity:0;
  background:repeating-conic-gradient(from 0deg at 50% 50%,#07060c 0 10deg,#140a26 10deg 20deg);clip-path:circle(0% at 50% 50%)}
#banner{position:absolute;left:0;right:0;top:38%;z-index:42;pointer-events:none;text-align:center;opacity:0;transition:opacity .8s ease}
#banner .b1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,8vw,72px);letter-spacing:.06em}
#banner .b2{font-size:13px;letter-spacing:.5em;text-indent:.5em;color:var(--muted);margin-top:8px}
#banner.void .b1{color:#e6d0ff;text-shadow:0 0 30px var(--void),0 0 80px var(--void-deep)}
#banner.being .b1{color:var(--gold-hi);text-shadow:0 0 30px var(--gold),0 0 80px #b98a3a}
#banner.plain .b1{color:var(--text);text-shadow:0 0 24px rgba(0,0,0,.8)}
#ending{background:radial-gradient(ellipse at 50% 40%,rgba(30,20,50,.35),rgba(4,3,8,.75));gap:18px;padding:0 max(24px,var(--sa-l));text-align:center}
#ending h2{margin:0;font-family:var(--f-display);font-size:clamp(30px,7vw,56px)}
#ending p{margin:0;font-family:var(--f-display);font-size:18px;line-height:1.8;max-width:620px;color:#dcd4ee;text-wrap:balance}

@media (max-width:640px){
  #bBox{flex-direction:column;gap:8px}
  #bCmd{width:auto}
  #bMsg{min-height:64px;font-size:15px;padding:12px 14px}
  .bp{width:min(230px,calc(62vw));padding:8px 11px 10px}
  .bp .nm{font-size:15px}
  .bp.ally{bottom:calc(var(--sa-b) + 250px)}
  #dTxt{font-size:15.5px}
  #quest{max-width:56vw;padding:8px 11px}
  #questText{font-size:13.5px}
  .ibtn{padding:8px 10px;font-size:12px}
  .cmd{min-height:52px;padding:8px 12px}
}
@media (prefers-reduced-motion:reduce){
  .load-mark,#dialog .next{animation:none}
  .pop{animation-duration:.01s}
}

      life: 0, max: o.life || 1, size: o.size || 0.3, endSize: o.endSize ?? 0, r: c.r, g: c.g, b: c.b,
      grav: o.grav || 0, drag: o.drag ?? 1.5, to: o.to || null, toK: o.toK || 0,

  }
  burst(at, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const th = Math.random() * Math.PI * 2, ph = Math.acos(rand(-1, 1)), sp = rand(o.speedMin ?? 1, o.speed ?? 5);
      const dx = Math.sin(ph) * Math.cos(th), dy = Math.cos(ph), dz = Math.sin(ph) * Math.sin(th);

        vx: dx * sp, vy: (o.flat ? Math.abs(dy) * 0.3 : dy) * sp + (o.up || 0), vz: dz * sp,

  update(dt) {

  }

}

// ---------------------------------------------------------------- input
const Input = {
  keys: {}, joy: { x: 0, y: 0, active: false }, runToggle: false, actionQueued: false, waiters: [],
  dragDX: 0, zoom: 0,
  axis() {
    let x = 0, y = 0; const k = this.keys;
    if (k.KeyA || k.ArrowLeft) x -= 1; if (k.KeyD || k.ArrowRight) x += 1;
    if (k.KeyW || k.ArrowUp) y += 1; if (k.KeyS || k.ArrowDown) y -= 1;
    if (this.joy.active) { x = this.joy.x; y = this.joy.y; }
    const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    return { x, y, run: !!(k.ShiftLeft || k.ShiftRight) || this.runToggle };
  },
};
function nextAction() { return new Promise((r) => Input.waiters.push(r)); }
function fireAction() {
  if (Input.waiters.length) { const w = Input.waiters; Input.waiters = []; w.forEach((f) => f()); return; }
  Input.actionQueued = true;
}
window.addEventListener('keydown', (e) => {
  const ae = document.activeElement;
  const onButton = ae && ae.tagName === 'BUTTON' && ae !== canvas;
  if ((e.code === 'Space' || e.code === 'Enter') && onButton) return; // native click handles it
  Input.keys[e.code] = true;
  if (!e.repeat && (e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyZ')) { fireAction(); e.preventDefault(); }
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat && typeof onHotkey === 'function') onHotkey(e.code);
});
window.addEventListener('keyup', (e) => { Input.keys[e.code] = false; });
window.addEventListener('blur', () => { Input.keys = {}; });

// camera drag (mouse or a finger outside the joystick) + wheel/pinch zoom
(function setupDrag() {
  let dragId = null, lastX = 0;
  const pinch = new Map(); let pinchD = 0;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.focus({ preventScroll: true });
    if (e.pointerType === 'touch') {
      pinch.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch.size === 2) { const [a, b] = [...pinch.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); dragId = null; return; }
    }
    dragId = e.pointerId; lastX = e.clientX;
  });
  window.addEventListener('pointermove', (e) => {
    if (pinch.has(e.pointerId)) {
      pinch.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch.size === 2) { const [a, b] = [...pinch.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); Input.zoom += (pinchD - d) * 0.03; pinchD = d; return; }
    }
    if (e.pointerId !== dragId) return;
    Input.dragDX += e.clientX - lastX; lastX = e.clientX;
  });
  const up = (e) => { pinch.delete(e.pointerId); if (e.pointerId === dragId) dragId = null; };
  window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', (e) => { Input.zoom += Math.sign(e.deltaY) * 1.2; e.preventDefault(); }, { passive: false });
})();

// virtual joystick
(function setupStick() {
  const stick = $('#stick'), knob = $('#knob');
  let id = null, cx = 0, cy = 0;
  stick.addEventListener('pointerdown', (e) => {
    id = e.pointerId; const r = stick.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    stick.setPointerCapture(id); move(e); e.preventDefault();
  });
  const move = (e) => {
    if (e.pointerId !== id) return;
    let dx = e.clientX - cx, dy = e.clientY - cy; const R = 52, l = Math.hypot(dx, dy);
    if (l > R) { dx = dx / l * R; dy = dy / l * R; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    Input.joy.x = dx / R; Input.joy.y = -dy / R; Input.joy.active = true;
  };
  stick.addEventListener('pointermove', move);
  const end = (e) => { if (e.pointerId !== id) return; id = null; knob.style.transform = ''; Input.joy.active = false; Input.joy.x = Input.joy.y = 0; };
  stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);
  $('#tA').addEventListener('pointerdown', (e) => { e.preventDefault(); fireAction(); });
  $('#tRun').addEventListener('click', () => { Input.runToggle = !Input.runToggle; $('#tRun').classList.toggle('on', Input.runToggle); });
})();

// ---------------------------------------------------------------- audio: tiny synth + sequencer
const Snd = {
  ctx: null, master: null, music: null, sfx: null, verb: null, song: null, step: 0, nextT: 0, timer: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = Settings.sound ? 0.8 : 0; this.master.connect(c.destination);
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4; comp.connect(this.master);
    this.music = c.createGain(); this.music.gain.value = 0.42; this.music.connect(comp);
    this.sfx = c.createGain(); this.sfx.gain.value = 0.75; this.sfx.connect(comp);
    // reverb send
    this.verb = c.createConvolver();
    const len = c.sampleRate * 2.8, buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    this.verb.buffer = buf;
    const vg = c.createGain(); vg.gain.value = 0.55; this.verb.connect(vg); vg.connect(comp);
    this.noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const nd = this.noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    this.timer = setInterval(() => this.tick(), 25);
  },
  setOn(on) { Settings.sound = on; saveSettings(); if (this.master) this.master.gain.setTargetAtTime(on ? 0.8 : 0, this.ctx.currentTime, 0.05); },
  mf(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  env(g, t, a, peak, d, sus = 0.0001) {
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(Math.max(sus, 0.0001), t + a + d);
  },
  voice(inst, midi, t, dur, vol = 1, out) {
    const c = this.ctx; if (!c) return; out = out || this.music;
    const f = this.mf(midi);
    const send = (node, amt) => { if (amt > 0) { const s = c.createGain(); s.gain.value = amt; node.connect(s); s.connect(this.verb); } };
    if (inst === 'pluck' || inst === 'lead') {
      const o = c.createOscillator(); o.type = inst === 'lead' ? 'square' : 'triangle'; o.frequency.value = f;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = inst === 'lead' ? 1800 : 3200;
      const g = c.createGain(); this.env(g, t, 0.006, 0.22 * vol, dur * 1.6);
      o.connect(lp); lp.connect(g); g.connect(out); send(g, 0.35); o.start(t); o.stop(t + dur * 1.8 + 0.1);
    } else if (inst === 'pad' || inst === 'choir') {
      const g = c.createGain(); const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = inst === 'choir' ? 1500 : 900; lp.Q.value = inst === 'choir' ? 4 : 0.7;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07 * vol, t + Math.min(0.8, dur * 0.4));
      g.gain.setValueAtTime(0.07 * vol, t + dur * 0.8); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.9);
      for (const det of [-9, 0, 8]) { const o = c.createOscillator(); o.type = inst === 'choir' ? 'sawtooth' : 'sawtooth'; o.frequency.value = f; o.detune.value = det; o.connect(lp); o.start(t); o.stop(t + dur + 1); }
      lp.connect(g); g.connect(out); send(g, 0.8);
    } else if (inst === 'bass') {
      const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(700, t); lp.frequency.exponentialRampToValueAtTime(160, t + dur);
      const g = c.createGain(); this.env(g, t, 0.01, 0.28 * vol, dur);
      o.connect(lp); lp.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.1);
    } else if (inst === 'bell') {
      for (const [mul, a] of [[1, 0.16], [2.76, 0.05], [5.4, 0.02]]) {
        const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * mul;
        const g = c.createGain(); this.env(g, t, 0.004, a * vol, dur * 2.5);

      }
    } else if (inst === 'kick') {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.16);
      const g = c.createGain(); this.env(g, t, 0.002, 0.8 * vol, 0.3); o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.4);
    } else if (inst === 'hat' || inst === 'snare') {
      const s = c.createBufferSource(); s.buffer = this.noiseBuf;
      const hp = c.createBiquadFilter(); hp.type = inst === 'hat' ? 'highpass' : 'bandpass'; hp.frequency.value = inst === 'hat' ? 7500 : 1800;
      const g = c.createGain(); this.env(g, t, 0.001, (inst === 'hat' ? 0.09 : 0.3) * vol, inst === 'hat' ? 0.05 : 0.16);
      s.connect(hp); hp.connect(g); g.connect(out); if (inst === 'snare') send(g, 0.3); s.start(t); s.stop(t + 0.3);
    } else if (inst === 'timp') {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(f * 1.5, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.08);
      const g = c.createGain(); this.env(g, t, 0.004, 0.55 * vol, 1.4); o.connect(g); g.connect(out); send(g, 0.5); o.start(t); o.stop(t + 1.6);
    }
  },
  play(name) {
    if (!this.ctx) return;
    if (this.song && this.song.name === name) return;
    const next = SONGS[name]; if (!next) return;
    this.music.gain.cancelScheduledValues(this.ctx.currentTime);
    this.music.gain.setValueAtTime(0.0, this.ctx.currentTime);
    this.music.gain.linearRampToValueAtTime(0.42, this.ctx.currentTime + 1.2);
    this.song = Object.assign({ name }, next); this.step = 0; this.nextT = this.ctx.currentTime + 0.12;
  },
  stop() { this.song = null; },
  tick() {
    const c = this.ctx; if (!c || !this.song) return;
    const s = this.song, spb = 60 / s.bpm / 4;
    while (this.nextT < c.currentTime + 0.14) {

    }
  },
  // one-shot effects
  fx(name, opt = {}) {
    const c = this.ctx; if (!c) return; const t = c.currentTime + 0.01; const o = this.sfx;
    const tone = (type, f0, f1, dur, vol, at = 0) => {
      const os = c.createOscillator(); os.type = type; os.frequency.setValueAtTime(f0, t + at); os.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + at + dur);
      const g = c.createGain(); this.env(g, t + at, 0.005, vol, dur); os.connect(g); g.connect(o); os.start(t + at); os.stop(t + at + dur + 0.05);
      const sg = c.createGain(); sg.gain.value = 0.25; g.connect(sg); sg.connect(this.verb);
    };
    const noise = (f0, f1, dur, vol, type = 'bandpass', at = 0, q = 1) => {
      const s = c.createBufferSource(); s.buffer = this.noiseBuf;
      const bf = c.createBiquadFilter(); bf.type = type; bf.Q.value = q; bf.frequency.setValueAtTime(f0, t + at); bf.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + at + dur);
      const g = c.createGain(); this.env(g, t + at, 0.01, vol, dur); s.connect(bf); bf.connect(g); g.connect(o); s.start(t + at); s.stop(t + at + dur + 0.05);
    };
    switch (name) {
      case 'select': tone('triangle', 880, 990, 0.06, 0.18); break;
      case 'confirm': tone('triangle', 660, 660, 0.07, 0.2); tone('triangle', 990, 990, 0.12, 0.2, 0.07); break;
      case 'back': tone('triangle', 660, 440, 0.1, 0.16); break;
      case 'talk': tone('square', 520 + Math.random() * 80, 500, 0.025, 0.035); break;
      case 'hit': noise(2400, 300, 0.22, 0.6); tone('square', 180, 60, 0.15, 0.25); break;
      case 'crit': noise(4000, 200, 0.35, 0.8); tone('sawtooth', 300, 40, 0.3, 0.3); break;
      case 'weak': noise(1200, 400, 0.15, 0.35); break;
      case 'whoosh': noise(400, 3000, 0.28, 0.35, 'bandpass', 0, 2); break;
      case 'fire': noise(800, 200, 0.5, 0.5, 'lowpass'); noise(3000, 1200, 0.4, 0.2); break;
      case 'water': noise(600, 2400, 0.45, 0.4, 'bandpass', 0, 3); tone('sine', 300, 900, 0.3, 0.12); break;
      case 'grass': noise(3000, 6000, 0.3, 0.25, 'highpass'); tone('triangle', 700, 1100, 0.2, 0.08); break;
      case 'thunder': noise(5000, 100, 0.6, 0.7, 'lowpass'); tone('sawtooth', 90, 40, 0.5, 0.3); break;
      case 'earth': noise(300, 60, 0.6, 0.8, 'lowpass'); tone('sine', 70, 30, 0.5, 0.5); break;
      case 'light': for (let i = 0; i < 5; i++) tone('sine', 1200 + i * 300, 1600 + i * 300, 0.25, 0.06, i * 0.04); break;
      case 'shadow': tone('sawtooth', 220, 70, 0.5, 0.18); noise(800, 200, 0.5, 0.25); break;
      case 'void': tone('sine', 400, 30, 1.2, 0.45); noise(2000, 40, 1.1, 0.4, 'lowpass'); tone('sawtooth', 55, 30, 1.2, 0.15); break;
      case 'genesis': for (let i = 0; i < 7; i++) tone('sine', 440 * Math.pow(1.26, i), 440 * Math.pow(1.26, i) * 1.01, 1.4, 0.07, i * 0.07); noise(800, 6000, 1.2, 0.2); break;
      case 'aura': tone('sine', 300, 900, 0.5, 0.15); break;
      case 'heal': for (let i = 0; i < 4; i++) tone('sine', 660 * Math.pow(1.25, i), 660 * Math.pow(1.25, i), 0.3, 0.1, i * 0.08); break;
      case 'faint': tone('triangle', 500, 80, 0.7, 0.25); break;
      case 'throw': noise(500, 2500, 0.35, 0.3, 'bandpass', 0, 3); break;
      case 'absorb': tone('sine', 200, 1400, 0.5, 0.25); break;
      case 'wobble': tone('triangle', 300, 220, 0.12, 0.25); noise(900, 400, 0.1, 0.2); break;
      case 'caught': [0, 4, 7, 12].forEach((s, i) => tone('triangle', this.mf(72 + s), this.mf(72 + s), 0.25, 0.18, i * 0.09)); break;
      case 'break': noise(6000, 800, 0.4, 0.5, 'highpass'); tone('square', 600, 200, 0.2, 0.12); break;
      case 'levelup': [0, 4, 7, 12, 16].forEach((s, i) => tone('square', this.mf(76 + s), this.mf(76 + s), 0.14, 0.08, i * 0.07)); break;
      case 'encounter': tone('sawtooth', 220, 880, 0.35, 0.18); noise(200, 4000, 0.4, 0.3); break;
      case 'fragment': [0, 7, 12, 19, 24].forEach((s, i) => tone('sine', this.mf(67 + s), this.mf(67 + s), 0.8, 0.12, i * 0.12)); break;
      case 'rumble': noise(140, 40, 2.5, 0.9, 'lowpass'); tone('sine', 50, 28, 2.4, 0.5); break;
      case 'step': noise(900, 500, 0.05, 0.05); break;
    }
  },
};

// procedural songs (step = 16th note). helper chord tables in MIDI.
const SONGS = {
  title: {
    bpm: 66,
    seq(st, t, spb, v) {
      const bar = Math.floor(st / 16) % 4, s = st % 16;
      const ch = [[50, 57, 62, 66, 69], [47, 54, 59, 62, 66], [43, 50, 55, 59, 62], [45, 52, 57, 61, 64]][bar];
      if (s === 0) { v('pad', ch[1], spb * 16, 0.9); v('pad', ch[3], spb * 16, 0.8); v('bass', ch[0] - 12, spb * 14, 0.5); }
      if (s % 4 === 0) v('bell', ch[2 + ((s / 4 + bar) % 3)] + 12, spb * 4, 0.35);
      if (s === 10 && bar % 2 === 1) v('bell', ch[4] + 12, spb * 6, 0.3);
    },
  },
  world: {
    bpm: 92,
    seq(st, t, spb, v) {
      const bar = Math.floor(st / 16) % 8, s = st % 16;
      const prog = [[50, 57, 62, 66, 69], [47, 54, 59, 62, 66], [43, 50, 55, 59, 62], [45, 52, 57, 61, 64], [50, 57, 62, 66, 69], [42, 49, 54, 57, 61], [43, 50, 55, 59, 62], [45, 52, 57, 61, 64]];
      const ch = prog[bar];
      if (s === 0) { v('pad', ch[1], spb * 16, 0.7); v('pad', ch[3], spb * 16, 0.55); }
      if (s === 0 || s === 10) v('bass', ch[0] - 12, spb * 5, 0.6);
      if (s % 2 === 0) v('pluck', ch[[1, 2, 3, 4, 3, 2, 3, 4][(s / 2) % 8]] + 12, spb * 2, 0.55);
      const mel = [[0, 74], [6, 76], [8, 78], [12, 81]];
      if (bar % 4 === 1) for (const [p, m] of mel) if (s === p) v('bell', m, spb * 4, 0.3);
      if (bar % 4 === 3 && s === 0) v('bell', 81, spb * 8, 0.3);
      if (bar % 4 === 3 && s === 8) v('bell', 78, spb * 8, 0.25);
    },
  },
  battle: {
    bpm: 152,
    seq(st, t, spb, v) {
      const bar = Math.floor(st / 16) % 8, s = st % 16;
      const prog = [45, 41, 43, 40, 45, 41, 38, 40];
      const r = prog[bar];
      v('bass', r - 12 + (s % 4 === 2 ? 12 : 0), spb * 1.5, s % 4 === 0 ? 0.9 : 0.6);
      if (s === 0 || s === 8 || (s === 14 && bar % 2)) v('kick', 0, 0, 0.9);
      if (s === 4 || s === 12) v('snare', 0, 0, 0.7);
      if (s % 2 === 1) v('hat', 0, 0, 0.6);
      const minor = (r === 45 || r === 40 || r === 38) ? 3 : 4;
      const arp = [0, 7, 12, minor + 12, 7, 12, minor + 24, 12];
      v('pluck', r + 12 + arp[s % 8], spb * 1.2, 0.35);
      if (s === 0) v('pad', r + 12 + minor, spb * 16, 0.5);
      const lead = [[0, 76], [3, 79], [6, 81], [8, 79], [10, 76], [12, 74]];
      if (bar % 2 === 0 && bar >= 4) for (const [p, m] of lead) if (s === p) v('lead', m - (bar === 6 ? 2 : 0), spb * 2.5, 0.4);
    },
  },
  void: {
    bpm: 72,
    seq(st, t, spb, v) {
      const bar = Math.floor(st / 16) % 4, s = st % 16;
      const prog = [37, 33, 38, 36];
      const r = prog[bar];
      if (s === 0) { v('choir', r + 24, spb * 16, 0.9); v('choir', r + 27, spb * 16, 0.7); v('choir', r + 31 + (bar === 3 ? 1 : 0), spb * 16, 0.6); v('bass', r - 12, spb * 16, 0.8); v('timp', r - 12, 0, 1); }
      if (s === 8 || s === 14) v('timp', r - 12, 0, 0.7);
      if (s % 4 === 2) v('pluck', r + 24 + [0, 3, 7, 6][(s / 4 | 0) % 4], spb * 3, 0.3);
      if (s === 6 && bar % 2) v('bell', r + 36 + 6, spb * 8, 0.35);
      if (s % 2 === 0) v('hat', 0, 0, 0.35);
      if (s === 4 || s === 12) v('snare', 0, 0, 0.45);
    },
  },
  being: {
    bpm: 80,
    seq(st, t, spb, v) {
      const bar = Math.floor(st / 16) % 4, s = st % 16;
      const prog = [[40, 52, 56, 59, 64], [47, 54, 59, 63, 66], [37, 49, 52, 56, 61], [45, 52, 57, 61, 64]];
      const ch = prog[bar];
      if (s === 0) { v('choir', ch[2] + 12, spb * 16, 0.8); v('choir', ch[3] + 12, spb * 16, 0.7); v('pad', ch[1], spb * 16, 0.7); v('bass', ch[0] - 12, spb * 16, 0.7); v('timp', ch[0] - 12, 0, 0.9); }
      if (s % 2 === 0) v('bell', ch[1 + ((s / 2) % 4)] + 24, spb * 3, 0.22);
      if (s === 8) v('timp', ch[0] - 12, 0, 0.6);
      if (s % 4 === 2) v('hat', 0, 0, 0.3);
    },
  },
  victory: {
    bpm: 140, once: true, len: 32, then: 'world',
    seq(st, t, spb, v) {
      const notes = { 0: 72, 2: 76, 4: 79, 6: 84, 10: 83, 12: 84 };

      if (st === 0 || st === 12) { v('pad', 60, spb * 12, 0.7); v('pad', 64, spb * 12, 0.6); v('bass', 48, spb * 10, 0.7); }
      if (st % 2 === 0 && st < 16) v('hat', 0, 0, 0.5);
    },
  },
};

function learnedMoves(sp, lv) {
  const L = SPECIES[sp].learn.filter(([l]) => l <= lv).map(([, m]) => m);
  return [...new Set(L)].slice(-4);
}
function maxHp(m) { return Math.floor((2 * SPECIES[m.sp].b[0] + m.iv[0]) * m.lv / 100) + m.lv + 10; }
function stat(m, i) { return Math.floor((2 * SPECIES[m.sp].b[i] + m.iv[i]) * m.lv / 100) + 5; }
function expNeed(lv) { return Math.floor(10 + lv * lv * 0.95); }
let _uid = 1;
function makeMon(sp, lv) {
  const m = { uid: Date.now().toString(36) + (_uid++), sp, lv, exp: 0, iv: [randi(0, 15), randi(0, 15), randi(0, 15), randi(0, 15)], moves: learnedMoves(sp, lv), status: null };
  m.hp = maxHp(m);
  return m;
}
function monName(m) { return SPECIES[m.sp].n; }
function monTypes(m) { return SPECIES[m.sp].t; }
function stageMul(s) { return s >= 0 ? (2 + s) / 2 : 2 / (2 - s); }
function hpColor(f) { return f > 0.5 ? 'var(--hp-good)' : f > 0.2 ? 'var(--hp-mid)' : 'var(--hp-low)'; }

// ---------- motes used by both legends
function motes(r, parent, n, color, radius, ysp, toCenter = false) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3), ph = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, rr = radius * (0.5 + Math.random() * 0.6);
    pos[i * 3] = Math.cos(a) * rr; pos[i * 3 + 1] = (Math.random() - 0.5) * ysp; pos[i * 3 + 2] = Math.sin(a) * rr; ph[i] = Math.random();
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('ph', new THREE.BufferAttribute(ph, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: Shared.time, uColor: { value: new THREE.Color(color).multiplyScalar(2.6) }, uTex: { value: TEX.dot }, uIn: { value: toCenter ? 1 : 0 } },
    vertexShader: `attribute float ph; uniform float uTime; uniform float uIn; varying float vA;
      void main(){ vec3 p = position; float k = fract(uTime*0.35 + ph);
        if(uIn > 0.5){ p = mix(p, vec3(0.0), k); vA = sin(k*3.14159); }
        else { float a = uTime*(0.3+ph*0.4); float c=cos(a), s=sin(a); p.xz = mat2(c,-s,s,c)*p.xz; p.y += sin(uTime*1.3+ph*20.0)*0.15; vA = 0.55+0.45*sin(uTime*3.0+ph*30.0); }
        vec4 mv = modelViewMatrix*vec4(p,1.0); gl_PointSize = (0.9+ph)*70.0/-mv.z; gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform vec3 uColor; uniform sampler2D uTex; varying float vA;
      void main(){ float a = texture2D(uTex, gl_PointCoord).a * vA; gl_FragColor = vec4(uColor*a, 1.0); }`,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
  });
  const p = new THREE.Points(g, m); p.frustumCulled = false; parent.add(p); return p;
}

function makeSpiritModel(sp) {

// white hit-flash by swapping materials for a moment
const FLASH_MAT = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 2.2, 2.2) });
function flashRig(r, on, mat = FLASH_MAT) {

    if (on) { if (!o.userData.m0) o.userData.m0 = o.material; o.material = mat; }

}

const GLSL_NOISE = `
  float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
  float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(hash12(i), hash12(i+vec2(1,0)), u.x), mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), u.x), u.y); }
`;

const SITES = {
  town: { x: 0, z: 50 },
  spawn: { x: 0, z: 63 },
  altar: { x: 0, z: -6 },
  rifts: [
    { id: 'east', x: 60, z: 6, name: '동쪽 균열', gx: 53.5, gz: 6.5 },

    { id: 'north', x: 4, z: -64, name: '북쪽 균열', gx: 3.5, gz: -57.5 },
  ],
};
const PATHS = [
  [[0, 68], [0, 50], [0, 32], [2, 14], [0, -6]],
  [[0, 32], [20, 26], [42, 14], [60, 6]],
  [[0, 32], [-20, 26], [-42, 12], [-60, 2]],
  [[0, -6], [3, -26], [3, -46], [4, -64]],
];
const ZONES = [
  { x: -14, z: 22, r: 8.5, pool: 'south', name: '남쪽 들판' },
  { x: 14, z: 20, r: 8, pool: 'south', name: '남쪽 들판' },
  { x: 40, z: 25, r: 9, pool: 'east', name: '불씨 언덕' },
  { x: -38, z: 23, r: 9, pool: 'west', name: '번개 습지' },
  { x: -13, z: -40, r: 9, pool: 'north', name: '그림자 숲길' },
  { x: 17, z: -46, r: 8, pool: 'north', name: '그림자 숲길' },
  { x: 17, z: -12, r: 6.5, pool: 'altar', name: '제단 비탈' },
  { x: -15, z: -1, r: 6, pool: 'altar', name: '제단 비탈' },
];

function segDist(px, pz, ax, az, bx, bz) {
  const vx = bx - ax, vz = bz - az, wx = px - ax, wz = pz - az;
  const t = clamp((wx * vx + wz * vz) / (vx * vx + vz * vz), 0, 1);
  return Math.hypot(px - (ax + vx * t), pz - (az + vz * t));
}
function pathDist(x, z) {
  let d = 1e9;
  for (const P of PATHS) for (let i = 0; i < P.length - 1; i++) d = Math.min(d, segDist(x, z, P[i][0], P[i][1], P[i + 1][0], P[i + 1][1]));
  return d;
}
function coastR(a) { return 90 + 7 * Math.sin(a * 3 + 1.3) + 4 * Math.sin(a * 7 + 0.4) + 2.5 * Math.sin(a * 13 + 2.1); }
function rawHeight(x, z) {
  const r = Math.hypot(x, z), a = Math.atan2(z, x);
  const m = 1 - smooth(coastR(a) - 20, coastR(a) + 3, r);
  let h = -3.4 + m * 4.8;
  h += (fbm(x * 0.028 + 11.3, z * 0.028 - 7.1, 4) - 0.45) * 5.0 * m;
  const g = (cx, cz, s, amp) => amp * Math.exp(-((x - cx) ** 2 + (z - cz) ** 2) / (2 * s * s)) * m;
  h += g(SITES.altar.x, SITES.altar.z, 15, 7.5);
  h += g(38, -36, 11, 11) + g(-40, -32, 11, 8) + g(-30, 64, 9, 5) + g(62, 40, 10, 6) + g(-64, 40, 9, 4);
  return h;
}
const FLATS = [];
function initFlats() {
  FLATS.length = 0;
  FLATS.push({ x: SITES.town.x, z: SITES.town.z + 4, r0: 15, r1: 25, h: 1.6 });
  FLATS.push({ x: SITES.altar.x, z: SITES.altar.z, r0: 9.5, r1: 15, h: rawHeight(SITES.altar.x, SITES.altar.z) });
  for (const r of SITES.rifts) FLATS.push({ x: r.x, z: r.z, r0: 7, r1: 13, h: Math.max(rawHeight(r.x, r.z), 1.5) });
}
function heightAt(x, z) {
  let h = rawHeight(x, z);
  const pd = pathDist(x, z);
  if (pd < 5) { const w = 1 - smooth(2.5, 5, pd); h = lerp(h, Math.max(h, 1.15), w); }
  for (const f of FLATS) {
    const d = Math.hypot(x - f.x, z - f.z);
    if (d < f.r1) h = lerp(h, f.h, 1 - smooth(f.r0, f.r1, d));
  }
  return h;
}

const World = {
  scene: null, camera: null, N: 200, SIZE: 300, grid: null,
  colliders: [], interact: [], npcs: [], rifts: {}, markers: [], zones: ZONES,
  camYaw: 0, camDist: 12, camPos: new THREE.Vector3(), camLook: new THREE.Vector3(), cine: null,
  heal: 0, healTarget: 0, dawn: 0, dawnTarget: 0, t: 0,
};

function groundY(x, z) {
  const W = World, N = W.N, S = W.SIZE, c = S / N;
  const fx = clamp((x + S / 2) / c, 0, N - 1e-3), fz = clamp((z + S / 2) / c, 0, N - 1e-3);
  const i = Math.floor(fz), j = Math.floor(fx), u = fx - j, v = fz - i, R = N + 1, g = W.grid;
  return lerp(lerp(g[i * R + j], g[i * R + j + 1], u), lerp(g[(i + 1) * R + j], g[(i + 1) * R + j + 1], u), v);
}

function buildWorld() {
  initFlats();
  const W = World;
  const scene = W.scene = new THREE.Scene();
  const cam = W.camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 1600);
  Cams.push(cam);
  scene.fog = new THREE.Fog(0x6a4a7a, 70, 300);

  // ---------------- lights
  W.hemi = new THREE.HemisphereLight(0xb9b0ff, 0x5a463a, 1.15); scene.add(W.hemi);
  W.sunDir = new THREE.Vector3(-0.62, 0.32, -0.55).normalize();
  const sun = W.sun = new THREE.DirectionalLight(0xffb98a, 2.7);
  sun.castShadow = true; sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
  const sc = sun.shadow.camera; sc.left = -34; sc.right = 34; sc.top = 34; sc.bottom = -34; sc.near = 1; sc.far = 160;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
  scene.add(sun); scene.add(sun.target);
  W.rim = new THREE.DirectionalLight(0x8f7bff, 0.7); W.rim.position.set(30, 20, 40); scene.add(W.rim);

  // ---------------- terrain heights
  const N = W.N, S = W.SIZE, R = N + 1;
  W.grid = new Float32Array(R * R);
  const noiseV = new Float32Array(R * R), pdV = new Float32Array(R * R);
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const x = -S / 2 + j * S / N, z = -S / 2 + i * S / N;
    W.grid[i * R + j] = heightAt(x, z);
    noiseV[i * R + j] = fbm(x * 0.09 + 3.3, z * 0.09 + 8.1, 3);
    pdV[i * R + j] = pathDist(x, z);
  }
  const geo = new THREE.PlaneGeometry(S, S, N, N); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let k = 0; k < pos.count; k++) pos.setY(k, W.grid[k]);
  geo.computeVertexNormals();
  const col = new Float32Array(pos.count * 3);
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  W.terrainGeo = geo; W._noiseV = noiseV; W._pdV = pdV;
  recolorTerrain();
  const terrain = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  terrain.receiveShadow = true; scene.add(terrain); W.terrain = terrain;

  // height texture for the sea shader
  const HT = 256, hd = new Uint8Array(HT * HT);
  for (let i = 0; i < HT; i++) for (let j = 0; j < HT; j++) {
    const x = -S / 2 + (j + 0.5) * S / HT, z = -S / 2 + (i + 0.5) * S / HT;
    hd[i * HT + j] = Math.round(clamp((groundY(x, z) + 8) / 12, 0, 1) * 255);
  }
  const htex = new THREE.DataTexture(hd, HT, HT, THREE.RedFormat); htex.magFilter = htex.minFilter = THREE.LinearFilter; htex.needsUpdate = true;

  // ---------------- sea
  W.waterU = {
    uTime: Shared.time, uH: { value: htex },
    uDeep: { value: new THREE.Color(0x0e2a55) }, uShallow: { value: new THREE.Color(0x2cc3c9) }, uFoam: { value: new THREE.Color(0xf4f0ff) },
    uSky: { value: new THREE.Color(0xb48ad0) }, uSunDir: { value: W.sunDir }, uSunCol: { value: new THREE.Color(0xffc29a) },
  };
  const water = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400, 1, 1).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog]), transparent: true, fog: true,
    vertexShader: `varying vec3 vW; ${FOG_V}
      void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; vec4 mvPosition = viewMatrix*w; gl_Position = projectionMatrix*mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `uniform float uTime; uniform sampler2D uH; uniform vec3 uDeep, uShallow, uFoam, uSky, uSunDir, uSunCol; varying vec3 vW;
      ${GLSL_NOISE}
      ${FOG_F}
      void main(){
        vec2 uv = (vW.xz + 150.0) / 300.0; float h = -8.0;
        if (uv.x > 0.0 && uv.y > 0.0 && uv.x < 1.0 && uv.y < 1.0) h = texture2D(uH, uv).r * 12.0 - 8.0;
        float depth = clamp(-h, 0.0, 8.0); float t = uTime;
        vec2 p = vW.xz * 0.16;
        float n1 = vnoise(p + vec2(t*0.09, t*0.05)), n2 = vnoise(p*2.3 - vec2(t*0.07, -t*0.1)), n3 = vnoise(p*5.1 + vec2(-t*0.15, t*0.12));
        vec3 N = normalize(vec3((n1-0.5)*0.55 + (n3-0.5)*0.25, 1.0, (n2-0.5)*0.55 - (n3-0.5)*0.2));
        vec3 V = normalize(cameraPosition - vW);
        float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);
        vec3 col = mix(uShallow, uDeep, smoothstep(0.0, 4.5, depth));
        col = mix(col, uSky, fres * 0.65);
        vec3 Rf = reflect(-V, N);
        col += uSunCol * pow(max(dot(Rf, uSunDir), 0.0), 90.0) * 2.6;
        float shore = 1.0 - smoothstep(0.0, 1.1, depth);
        float wave = sin(depth * 7.0 - t * 1.8 + vnoise(vW.xz*0.3)*4.0) * 0.5 + 0.5;
        float fo = smoothstep(0.62, 0.9, wave * shore + vnoise(vW.xz * 0.9 + t * 0.3) * 0.35);
        col = mix(col, uFoam * 1.3, clamp(fo + smoothstep(0.25, 0.0, depth) * 0.7, 0.0, 1.0) * shore);
        col += vec3(1.6) * step(0.986, vnoise(vW.xz * 2.4 + vec2(t * 0.5, 0.0))) * (1.0 - shore) * fres * 3.0;
        float a = mix(0.55, 0.96, smoothstep(0.0, 2.2, depth));
        gl_FragColor = vec4(col, a);
        #include <fog_fragment>
      }`,
  }));
  Object.assign(water.material.uniforms, W.waterU);
  water.position.y = 0; scene.add(water); W.water = water;
  // dark sea floor so deep water reads properly at distance
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x081a36 }));
  floor.position.y = -7.5; scene.add(floor);

  // ---------------- sky
  W.skyU = makeSkyUniforms();
  W.sky = makeSky(W.skyU); scene.add(W.sky);

  // ---------------- vegetation & props
  buildTrees(scene);
  buildRocksAndFlowers(scene);
  W.grass = buildGrass(scene, ZONES);
  W.fireflies = buildFireflies(scene);
  buildTown(scene);
  buildAltar(scene);
  for (const r of SITES.rifts) buildRift(scene, r);
  W.fx = new Particles(scene, 1600);

  // ---------------- player & follower
  W.player = buildPerson({ top: 0xf1f3fb, bottom: 0x2b2f4a, accent: 0x7d55f0, hair: 0x2a2238, pin: 0xffd98a });
  W.player.root.position.set(SITES.spawn.x, groundY(SITES.spawn.x, SITES.spawn.z), SITES.spawn.z);
  W.player.root.rotation.y = Math.PI;
  scene.add(W.player.root);
  W.follower = null;
  W.camYaw = 0;
  snapCamera();
}

function riftCorruption(x, z) {
  let c = 0;
  for (const r of SITES.rifts) {
    if (S.flags['closed_' + r.id]) continue;
    c = Math.max(c, 1 - smooth(5, 17, Math.hypot(x - r.x, z - r.z)));
  }
  return c;
}
function recolorTerrain() {
  const W = World, geo = W.terrainGeo, pos = geo.attributes.position, nrm = geo.attributes.normal, col = geo.attributes.color;
  const C = (h) => new THREE.Color(h);
  const SAND = C(0xe9d3a0), WET = C(0xb79e72), G1 = C(0x5aa64a), G2 = C(0x86c45c), G3 = C(0x3d8645), NORTH = C(0x47905a),
    ROCK = C(0x8f877c), DIRT = C(0xc99d68), LUSH = C(0x2f7a3e), CORR = C(0x3e2a62), STONE = C(0xcfc6b6), ALT = C(0xb7b0c8), HIGH = C(0xa5c47a);
  const c = new THREE.Color();
  for (let k = 0; k < pos.count; k++) {
    const x = pos.getX(k), y = pos.getY(k), z = pos.getZ(k), n = W._noiseV[k], ny = nrm.getY(k);
    c.copy(G1).lerp(G2, smooth(0.45, 0.75, n)).lerp(G3, smooth(0.45, 0.2, n) * 0.8);
    if (z < -20) c.lerp(NORTH, smooth(-20, -45, z) * 0.6);
    if (y > 6) c.lerp(HIGH, smooth(6, 12, y) * 0.5);
    for (const zz of ZONES) { const d = Math.hypot(x - zz.x, z - zz.z); if (d < zz.r + 2) c.lerp(LUSH, (1 - smooth(zz.r - 1, zz.r + 2, d)) * 0.75); }
    const pd = W._pdV[k]; if (pd < 3.6) c.lerp(DIRT, (1 - smooth(1.7, 3.6, pd)) * (0.85 + n * 0.15));
    const dt = Math.hypot(x - SITES.town.x, z - SITES.town.z); if (dt < 10) c.lerp(STONE, 1 - smooth(8.5, 10, dt));
    const da = Math.hypot(x - SITES.altar.x, z - SITES.altar.z); if (da < 10.5) c.lerp(ALT, 1 - smooth(9, 10.5, da));
    if (ny < 0.84) c.lerp(ROCK, smooth(0.84, 0.7, ny));
    if (y < 1.0) c.lerp(SAND, smooth(1.0, 0.45, y));
    if (y < 0.1) c.lerp(WET, smooth(0.1, -0.6, y));
    const cr = riftCorruption(x, z); if (cr > 0) c.lerp(CORR, cr * (0.75 + n * 0.25));
    col.setXYZ(k, c.r, c.g, c.b);
  }
  col.needsUpdate = true;
}

function makeSkyUniforms() {
  return {
    uTime: Shared.time,
    uTop: { value: new THREE.Color(0x0c0a2a) }, uMid: { value: new THREE.Color(0x4a2a6a) }, uHor: { value: new THREE.Color(0xe0728a) },
    uSunDir: { value: new THREE.Vector3(-0.62, 0.32, -0.55).normalize() }, uMoonDir: { value: new THREE.Vector3(0.55, 0.42, -0.72).normalize() },
    uCrackDir: { value: new THREE.Vector3(0.08, 0.5, -1).normalize() }, uCrack: { value: 1 }, uStars: { value: 1 },
  };
}
function makeSky(U) {
  const g = new THREE.Group();
  const mat = new THREE.ShaderMaterial({
    uniforms: U, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position = p.xyww; }`,
    fragmentShader: `uniform vec3 uTop, uMid, uHor, uSunDir, uMoonDir, uCrackDir; uniform float uTime, uCrack, uStars; varying vec3 vDir;
      ${GLSL_NOISE}
      vec2 crackLine(vec2 q, float L, float w, float seed){
        float along = q.y, across = q.x;
        float jag = (vnoise(vec2(along*9.0, seed))-0.5)*0.09 + (vnoise(vec2(along*27.0, seed+7.7))-0.5)*0.035;
        float ww = w * (1.0 - smoothstep(0.0, L, abs(along)));
        float d = abs(across - jag);
        float inside = step(d, ww) * step(abs(along), L);
        float glow = exp(-max(d - ww, 0.0) * 55.0) * (1.0 - smoothstep(L*0.75, L*1.1, abs(along)));
        return vec2(inside, glow);
      }
      void main(){
        vec3 d = normalize(vDir); float y = d.y;
        vec3 col = mix(uHor, uMid, smoothstep(-0.04, 0.3, y));
        col = mix(col, uTop, smoothstep(0.3, 0.9, y));
        col = mix(col, uHor * 0.45, smoothstep(0.0, -0.25, y));
        float s = max(dot(d, uSunDir), 0.0);
        col += vec3(1.0, 0.55, 0.32) * pow(s, 5.0) * 0.5 + vec3(1.0, 0.82, 0.6) * pow(s, 900.0) * 5.0;
        float bands = vnoise(vec2(atan(d.z, d.x) * 3.0, y * 14.0)) * smoothstep(0.02, 0.12, y) * smoothstep(0.35, 0.12, y);
        col = mix(col, col * 1.25 + vec3(0.06, 0.02, 0.05), bands * 0.6);
        float md = dot(d, uMoonDir);
        float moon = smoothstep(0.99935, 0.99955, md);
        vec3 mc = vec3(0.92, 0.9, 1.0) * (0.85 + 0.15 * vnoise(d.xz * 900.0));
        col = mix(col, mc * 1.4, moon * uStars);
        col += vec3(0.5, 0.45, 0.8) * pow(max(md, 0.0), 220.0) * 0.6 * uStars;
        vec3 c = normalize(uCrackDir);
        vec3 tX = normalize(cross(vec3(0.0, 1.0, 0.0), c)); vec3 tY = cross(c, tX);
        float dc = dot(d, c);
        if (dc > 0.2 && uCrack > 0.001) {
          vec2 q = vec2(dot(d, tX), dot(d, tY)) / dc;
          float L = 0.62 * uCrack, w = 0.085 * min(uCrack, 1.5);
          vec2 a = crackLine(q, L, w, 3.1);
          vec2 qb = mat2(0.77, -0.64, 0.64, 0.77) * (q - vec2(0.02, 0.18 * uCrack)); qb.y -= L * 0.32;
          vec2 b = crackLine(qb, L * 0.34, w * 0.6, 11.0);
          vec2 qc = mat2(0.8, 0.6, -0.6, 0.8) * (q + vec2(0.0, 0.22 * uCrack)); qc.y += L * 0.28;
          vec2 e = crackLine(qc, L * 0.3, w * 0.5, 19.0);
          float inside = max(a.x, max(b.x, e.x)); float glow = max(a.y, max(b.y * 0.8, e.y * 0.8));
          vec3 voidc = vec3(0.008, 0.0, 0.02) + vec3(0.3, 0.06, 0.55) * pow(vnoise(q * 16.0 + uTime * 0.25), 3.0);
          col = mix(col, voidc, inside);
          col += vec3(1.25, 0.32, 2.3) * glow * (1.0 - inside) * min(uCrack, 1.6) * 0.85;
          col += vec3(0.35, 0.08, 0.6) * exp(-length(vec2(q.x * 1.7, q.y * 0.75)) * 2.6) * 0.55 * min(uCrack, 1.5);
        }
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(700, 48, 24), mat); dome.frustumCulled = false; dome.renderOrder = -10; g.add(dome);
  // stars
  const n = 1800, sp = new Float32Array(n * 3), ss = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let x, yy, z; do { x = rand(-1, 1); yy = rand(0.04, 1); z = rand(-1, 1); } while (x * x + yy * yy + z * z > 1);
    const l = Math.hypot(x, yy, z); sp[i * 3] = x / l * 650; sp[i * 3 + 1] = yy / l * 650; sp[i * 3 + 2] = z / l * 650; ss[i] = Math.random();
  }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(sp, 3)); sg.setAttribute('seed', new THREE.BufferAttribute(ss, 1));
  const stars = new THREE.Points(sg, new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uStars: U.uStars, uTex: { value: TEX.dot } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    vertexShader: `attribute float seed; uniform float uTime; varying float vA; void main(){ vec3 p = position; float h = normalize(p).y;
      vA = smoothstep(0.08, 0.35, h) * (0.55 + 0.45 * sin(uTime * (1.0 + seed * 3.0) + seed * 40.0)) * (0.35 + seed * 0.65);
      vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_PointSize = 1.5 + seed * 2.6; gl_Position = projectionMatrix * mv; gl_Position.z = gl_Position.w * 0.9999; }`,
    fragmentShader: `uniform sampler2D uTex; uniform float uStars; varying float vA; void main(){ float a = texture2D(uTex, gl_PointCoord).a * vA * uStars; gl_FragColor = vec4(vec3(0.9, 0.92, 1.2) * a * 1.6, 1.0); }`,
  }));
  stars.frustumCulled = false; stars.renderOrder = -9; g.add(stars);
  // clouds
  g.userData.clouds = [];
  for (let i = 0; i < 16; i++) {
    const a = rand(0, Math.PI * 2), el = rand(0.04, 0.2), dist = 560;
    const sm = new THREE.SpriteMaterial({ map: TEX.cloud, color: new THREE.Color(0xf0a6c0), transparent: true, opacity: rand(0.35, 0.6), depthWrite: false, fog: false });

    spr.position.set(Math.cos(a) * dist * Math.cos(el), Math.sin(el) * dist, Math.sin(a) * dist * Math.cos(el));

  }

// ---------------- trees (instanced)
function buildTrees(scene) {
  const rng = mulberry32(1337);
  const round = [], pine = [];
  const ok = (x, z) => {
    const h = groundY(x, z); if (h < 1.3 || h > 13) return false;
    if (pathDist(x, z) < 4.5) return false;
    for (const zz of ZONES) if (Math.hypot(x - zz.x, z - zz.z) < zz.r + 2.5) return false;
    if (Math.hypot(x - SITES.town.x, z - SITES.town.z) < 22) return false;
    if (Math.hypot(x - SITES.altar.x, z - SITES.altar.z) < 15) return false;
    for (const r of SITES.rifts) if (Math.hypot(x - r.x, z - r.z) < 12) return false;
    for (const t of round.concat(pine)) if (Math.hypot(x - t.x, z - t.z) < 3.6) return false;
    return true;
  };
  for (let k = 0; k < 2600 && round.length + pine.length < 230; k++) {
    const x = (rng() - 0.5) * 190, z = (rng() - 0.5) * 190;
    if (!ok(x, z)) continue;
    const s = 0.8 + rng() * 0.7;
    const isPine = z < -18 ? rng() < 0.75 : rng() < 0.18;
    (isPine ? pine : round).push({ x, z, s, r: rng() * 6.28, blossom: !isPine && z > 20 && rng() < 0.35, v: rng() });
    World.colliders.push({ x, z, r: 0.7 * s });
  }
  const trunkG = new THREE.CylinderGeometry(0.18, 0.3, 2.2, 7).translate(0, 1.1, 0);
  const trunkM = new THREE.MeshToonMaterial({ color: 0x6b4a33, gradientMap: toonGrad });
  const all = round.concat(pine);
  const trunks = new THREE.InstancedMesh(trunkG, trunkM, all.length);
  const canG = new THREE.IcosahedronGeometry(1, 1);
  const canM = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
  const cans = new THREE.InstancedMesh(canG, canM, round.length * 3);
  const pineG = new THREE.ConeGeometry(1, 1.6, 7);
  const pines = new THREE.InstancedMesh(pineG, canM, pine.length * 3);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3(), c = new THREE.Color();
  all.forEach((t, i) => {
    const y = groundY(t.x, t.z) - 0.1;
    m4.compose(v.set(t.x, y, t.z), q.setFromEuler(e.set(0, t.r, 0)), sc.set(t.s, t.s * (pine.includes(t) ? 1.1 : 1), t.s));
    trunks.setMatrixAt(i, m4);
  });
  const greens = [0x3e8f4a, 0x4fa857, 0x5cb25a, 0x357d47], pinks = [0xf2a6c8, 0xf7bfd8, 0xe68fb6];
  round.forEach((t, i) => {
    const y = groundY(t.x, t.z) + 2.0 * t.s;
    const offs = [[0, 0.5, 0, 1.25], [0.7, 0.05, 0.3, 0.95], [-0.6, 0.1, -0.35, 0.9]];
    offs.forEach(([ox, oy, oz, s], k) => {
      m4.compose(v.set(t.x + ox * t.s, y + oy * t.s, t.z + oz * t.s), q.setFromEuler(e.set(t.r, t.r * 2, 0)), sc.setScalar(s * t.s * 1.15));
      cans.setMatrixAt(i * 3 + k, m4);
      c.setHex(t.blossom ? pinks[(i + k) % 3] : greens[(i + k) % 4]); cans.setColorAt(i * 3 + k, c);
    });
  });
  pine.forEach((t, i) => {
    const y = groundY(t.x, t.z);
    for (let k = 0; k < 3; k++) {
      const s = (1.6 - k * 0.38) * t.s;
      m4.compose(v.set(t.x, y + (1.9 + k * 1.05) * t.s, t.z), q.setFromEuler(e.set(0, t.r + k, 0)), sc.set(s, s, s));
      pines.setMatrixAt(i * 3 + k, m4);
      c.setHex([0x2f6b4a, 0x3a7a55, 0x2a5f44][(i + k) % 3]); pines.setColorAt(i * 3 + k, c);
    }
  });
  for (const im of [trunks, cans, pines]) { im.castShadow = true; im.receiveShadow = true; im.instanceMatrix.needsUpdate = true; if (im.instanceColor) im.instanceColor.needsUpdate = true; scene.add(im); }
}

function buildRocksAndFlowers(scene) {
  const rng = mulberry32(99);
  const rocks = [];
  for (let k = 0; k < 900 && rocks.length < 70; k++) {
    const x = (rng() - 0.5) * 200, z = (rng() - 0.5) * 200, h = groundY(x, z);
    if (h < 0.4 || pathDist(x, z) < 3.5 || Math.hypot(x - SITES.town.x, z - SITES.town.z) < 16) continue;
    let bad = false; for (const zz of ZONES) if (Math.hypot(x - zz.x, z - zz.z) < zz.r) bad = true; if (bad) continue;
    const s = 0.35 + Math.pow(rng(), 2) * 1.8;
    rocks.push({ x, z, s, h, r: rng() * 6 });
    if (s > 0.9) World.colliders.push({ x, z, r: s * 0.8 });
  }
  const rm = new THREE.InstancedMesh(GEO.dodeca, new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }), rocks.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3(), c = new THREE.Color();
  rocks.forEach((r, i) => {
    m4.compose(v.set(r.x, r.h + r.s * 0.2, r.z), q.setFromEuler(e.set(r.r, r.r * 1.7, r.r * 0.3)), sc.set(r.s, r.s * 0.75, r.s));
    rm.setMatrixAt(i, m4); c.setHex([0x8c8378, 0x9a9184, 0x7b746c][i % 3]); rm.setColorAt(i, c);
  });
  rm.castShadow = rm.receiveShadow = true; scene.add(rm);
  // flowers: little glowing dots that catch the bloom at dusk
  const fl = [];
  for (let k = 0; k < 3000 && fl.length < 700; k++) {
    const x = (rng() - 0.5) * 180, z = (rng() - 0.5) * 180, h = groundY(x, z);
    if (h < 1.1 || h > 9 || pathDist(x, z) < 2.4) continue;
    fl.push({ x, z, h });
  }
  const fm = new THREE.InstancedMesh(new THREE.OctahedronGeometry(0.11, 0), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.3, 1.3, 1.3) }), fl.length);
  const fc = [0xffc6e0, 0xfff1a8, 0xd9c8ff, 0xffffff, 0xa8e6ff];
  fl.forEach((f, i) => { m4.compose(v.set(f.x, f.h + 0.15, f.z), q.identity(), sc.setScalar(0.7 + rng() * 0.6)); fm.setMatrixAt(i, m4); c.setHex(fc[i % fc.length]); fm.setColorAt(i, c); });
  scene.add(fm);
}

// ---------------- tall grass meadows: instanced blades with wind + player push
function buildGrass(scene, zones) {
  const blade = new THREE.BufferGeometry();
  blade.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-0.07, 0, 0, 0.07, 0, 0, -0.05, 0.5, 0, 0.05, 0.5, 0, 0, 1, 0]), 3));
  blade.setIndex([0, 1, 2, 2, 1, 3, 2, 3, 4]);
  const U = { uTime: Shared.time, uPlayer: { value: new THREE.Vector3() }, uLow: { value: new THREE.Color(0x1f5a2c) }, uHigh: { value: new THREE.Color(0x9ad86a) }, uTint: { value: new THREE.Color(0xffc8a0) } };
  const mat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog]), side: THREE.DoubleSide, fog: true,
    vertexShader: `uniform float uTime; uniform vec3 uPlayer; varying float vH; varying float vV; ${FOG_V}
      void main(){
        vec3 p = position; vH = p.y;
        vec4 wp = modelMatrix * instanceMatrix * vec4(p, 1.0);
        vec3 base = (modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
        vV = fract(sin(dot(base.xz, vec2(12.9898, 78.233))) * 43758.5453);
        float k = p.y * p.y;
        float sway = sin(uTime * 1.7 + base.x * 0.32 + base.z * 0.25) * 0.22 + sin(uTime * 3.3 + base.x * 1.1) * 0.06;
        wp.x += sway * k; wp.z += sway * 0.4 * k;
        vec2 d = base.xz - uPlayer.xz; float dist = length(d);
        float push = (1.0 - smoothstep(0.0, 1.5, dist)) * k;
        wp.xz += normalize(d + 1e-4) * push * 0.75; wp.y -= push * 0.35;
        vec4 mvPosition = viewMatrix * wp; gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `uniform vec3 uLow, uHigh, uTint; varying float vH; varying float vV; ${FOG_F}
      void main(){ vec3 c = mix(uLow, uHigh * (0.8 + vV * 0.4), smoothstep(0.0, 1.0, vH)); c = mix(c, c * uTint * 1.15, smoothstep(0.6, 1.0, vH) * 0.5);
        gl_FragColor = vec4(c, 1.0);
        #include <fog_fragment>
      }`,
  });
  Object.assign(mat.uniforms, U);
  const dens = Settings.high ? 9 : 4.5;
  const list = [];
  for (const z of zones) {
    const n = Math.floor(Math.PI * z.r * z.r * dens);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * z.r;
      const x = z.x + Math.cos(a) * rr, zz = z.z + Math.sin(a) * rr;
      const edge = 1 - smooth(z.r * 0.75, z.r, rr);
      list.push([x, zz, (0.9 + Math.random() * 0.7) * (0.45 + edge * 0.55)]);
    }
  }
  const im = new THREE.InstancedMesh(blade, mat, list.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3();
  list.forEach(([x, z, h], i) => { m4.compose(v.set(x, groundY(x, z) - 0.05, z), q.setFromEuler(e.set(rand(-0.15, 0.15), rand(0, 6.28), rand(-0.15, 0.15))), sc.set(1.1, h, 1)); im.setMatrixAt(i, m4); });
  im.frustumCulled = false; im.receiveShadow = false;
  scene.add(im);
  return { mesh: im, U: mat.uniforms };
}

function buildFireflies(scene) {

function buildRift(scene, R) {
  const y = groundY(R.x, R.z);
  const g = grp(scene, [R.x, y, R.z]);
  const U = { uTime: Shared.time, uOpen: { value: 1 } };
  const tear = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 9), new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform float uTime, uOpen; varying vec2 vUv;
      ${GLSL_NOISE}
      void main(){
        vec2 p = vUv * 2.0 - 1.0;
        float jag = (vnoise(vec2(p.y * 6.0, uTime * 0.4)) - 0.5) * 0.32 + (vnoise(vec2(p.y * 17.0, 3.0)) - 0.5) * 0.14;
        float halfW = 0.36 * (1.0 - pow(abs(p.y), 1.7)) * uOpen;
        float d = abs(p.x - jag * 0.6) - halfW;
        if (d > 0.5 || uOpen < 0.01) discard;
        float edge = exp(-max(d, 0.0) * 13.0);
        vec2 sw = vec2(p.x * 3.0 + sin(p.y * 4.0 + uTime) * 0.6, p.y * 3.0 - uTime * 0.6);
        vec3 inside = vec3(0.01, 0.0, 0.03) + vec3(0.32, 0.06, 0.6) * pow(vnoise(sw * 2.0), 3.0) + vec3(0.9, 0.3, 1.5) * pow(vnoise(sw * 5.0 + 10.0), 8.0);
        vec3 col; float a;
        if (d < 0.0) { col = inside + vec3(1.0, 0.35, 2.0) * smoothstep(-0.07, 0.0, d) * 2.4; a = 1.0; }
        else { col = vec3(1.1, 0.3, 2.2) * edge * 2.2; a = edge * (1.0 - smoothstep(0.7, 1.0, abs(p.y))); }
        gl_FragColor = vec4(col, a);
      }`,
  }));
  tear.position.y = 4.4; g.add(tear);
  const shards = grp(g, [0, 4.2, 0]);
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2, rr = 2.8 + (i % 3) * 0.6;
    const s = part(GEO.octa, voidMat(0xb055ff, 2.2), shards, [Math.cos(a) * rr, Math.sin(a * 2) * 2, Math.sin(a) * rr], [0.16, 0.38, 0.16], [a, 0, a * 0.5]);
    s.userData.ph = i;

  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, el = rand(-1, 1), rr = rand(5, 9); pos[i * 3] = Math.cos(a) * rr; pos[i * 3 + 1] = el * 5; pos[i * 3 + 2] = Math.sin(a) * rr; ph[i] = Math.random(); }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); pg.setAttribute('ph', new THREE.BufferAttribute(ph, 1));
  const pU = { uTime: Shared.time, uTex: { value: TEX.dot }, uOpen: U.uOpen };
  const pts = new THREE.Points(pg, new THREE.ShaderMaterial({
    uniforms: pU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `attribute float ph; uniform float uTime, uOpen; varying float vA; void main(){ float k = fract(uTime * 0.28 + ph); vec3 p = mix(position, vec3(0.0), k * k);
      vA = sin(k * 3.14159) * uOpen; vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_PointSize = 90.0 * (0.5 + ph) / -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform sampler2D uTex; varying float vA; void main(){ float a = texture2D(uTex, gl_PointCoord).a * vA; gl_FragColor = vec4(vec3(0.85, 0.3, 1.6) * a * 1.8, 1.0); }`,
  }));
  pts.position.y = 4.4; pts.frustumCulled = false; g.add(pts);
  const light = new THREE.PointLight(0xb055ff, 40, 24, 1.4); light.position.y = 4; g.add(light);
  const bloom = grp(g, [0, 0, 0]); bloom.visible = false;
  part(GEO.cyl, M(0xcfc6b6), bloom, [0, 0.2, 0], [0.9, 0.4, 0.9]);
  const bc = part(GEO.octa, E(0xffd98a, 3), bloom, [0, 1.6, 0], [0.35, 0.6, 0.35]);
  World.colliders.push({ x: R.x, z: R.z, r: 2.4 });

function placeRiftState() {
  for (const r of SITES.rifts) {
    const o = World.rifts[r.id], closed = !!S.flags['closed_' + r.id];
    o.open = closed ? 0 : 1; o.U.uOpen.value = o.open;
    o.tear.visible = o.pts.visible = o.shards.visible = !closed; o.light.intensity = closed ? 0 : 40; o.bloom.visible = closed;
  }
  for (let i = 0; i < 3; i++) World.sockets[i].material = i < fragCount() ? E(0xffd98a, 3) : M(0x2a2238);
  const done = !!S.flags.ending;
  World.altarRunes.forEach((r) => (r.material = (fragCount() >= 3 || done) ? E(0xffd27a, 1.5) : E(0x9b6bff, 1.6)));
  World.altarLight.color.setHex(fragCount() >= 3 || done ? 0xffd27a : 0xb48cff);
  World.healTarget = S.flags.awakened && !done ? 0.35 : fragCount() / 3; World.heal = World.healTarget;
  World.dawnTarget = done ? 1 : 0; World.dawn = World.dawnTarget;
  recolorTerrain();
}
function fragCount() { return SITES.rifts.reduce((s, r) => s + (S.flags['closed_' + r.id] ? 1 : 0), 0); }

// ---------------- atmosphere: lerp between corrupted dusk, healed sunset, and dawn
const ATMOS = {
  dark:  { top: 0x0c0a2a, mid: 0x4a2a6a, hor: 0xe0728a, fog: 0x6a4a7a, sun: 0xffa27a, hemiS: 0xb0a4ff, hemiG: 0x5a463a, sea: 0xb48ad0, cloud: 0xf0a6c0, sunI: 2.5, stars: 1 },
  heal:  { top: 0x15204a, mid: 0x6a4a9a, hor: 0xffa47a, fog: 0x8a6a8a, sun: 0xffc08a, hemiS: 0xc8c0ff, hemiG: 0x6a5440, sea: 0xd0a0c8, cloud: 0xffc0b0, sunI: 2.9, stars: 0.8 },
  dawn:  { top: 0x2f62b0, mid: 0x8fb4ea, hor: 0xffd6a8, fog: 0xc8d0e8, sun: 0xfff0d8, hemiS: 0xe4ecff, hemiG: 0x7a6a50, sea: 0xbfe2ff, cloud: 0xffffff, sunI: 3.3, stars: 0 },
};
function applyAtmos() {
  const W = World, a = ATMOS.dark, b = ATMOS.heal, d = ATMOS.dawn, h = W.heal, k = W.dawn;
  const mix = (key) => new THREE.Color(a[key]).lerp(new THREE.Color(b[key]), h).lerp(new THREE.Color(d[key]), k);
  const num = (key) => lerp(lerp(a[key], b[key], h), d[key], k);
  W.skyU.uTop.value.copy(mix('top')); W.skyU.uMid.value.copy(mix('mid')); W.skyU.uHor.value.copy(mix('hor'));
  W.skyU.uStars.value = num('stars');
  W.scene.fog.color.copy(mix('fog'));
  W.sun.color.copy(mix('sun')); W.sun.intensity = num('sunI');
  W.hemi.color.copy(mix('hemiS')); W.hemi.groundColor.copy(mix('hemiG'));
  W.waterU.uSky.value.copy(mix('sea'));
  const cc = mix('cloud'); for (const c of W.sky.userData.clouds) c.material.color.copy(cc);
  if (!W.crackOverride) W.skyU.uCrack.value = S.flags.ending ? 0 : S.flags.awakened ? 2.2 : (1 - h * 0.65);
  const sd = W.sunDir.clone(); sd.y = lerp(0.32, 0.5, k); sd.normalize(); W.skyU.uSunDir.value.copy(sd);
}

// ---------------- camera
function snapCamera() {
  const W = World, p = W.player.root.position;
  const d = W.camDist, h = d * 0.5 + 1.5;
  W.camPos.set(p.x + Math.sin(W.camYaw) * d, p.y + h, p.z + Math.cos(W.camYaw) * d);
  W.camLook.set(p.x, p.y + 1.3, p.z);

}

function updateWorld(dt, controllable) {
  const W = World; W.t += dt;
  const P = W.player;
  let moving = 0;
  if (controllable) {
    const ax = Input.axis();
    W.camYaw -= Input.dragDX * 0.006; Input.dragDX = 0;
    W.camDist = clamp(W.camDist + Input.zoom, 6.5, 19); Input.zoom = 0;
    if (Input.keys.KeyQ) W.camYaw += dt * 1.8; if (Input.keys.KeyR) W.camYaw -= dt * 1.8;
    const mag = Math.hypot(ax.x, ax.y);
    if (mag > 0.08) {
      const fx = -Math.sin(W.camYaw), fz = -Math.cos(W.camYaw), rx = Math.cos(W.camYaw), rz = -Math.sin(W.camYaw);
      let dx = rx * ax.x + fx * ax.y, dz = rz * ax.x + fz * ax.y; const l = Math.hypot(dx, dz); dx /= l; dz /= l;
      const sp = (ax.run ? 10.5 : 6) * Math.min(1, mag);
      const p = P.root.position, ox = p.x, oz = p.z;
      const [nx, nz] = tryMove(p.x, p.z, dx * sp * dt, dz * sp * dt);
      p.x = nx; p.z = nz;
      const moved = Math.hypot(nx - ox, nz - oz);
      P.root.rotation.y = dampAngle(P.root.rotation.y, Math.atan2(dx, dz), 14, dt);
      moving = clamp(moved / dt / 6, 0, 1.4);
      W.stepAcc = (W.stepAcc || 0) + moved;
      if (W.stepAcc > (ax.run ? 2.4 : 1.7)) { W.stepAcc = 0; Snd.fx('step'); }
      onPlayerMoved(moved);
    }
  } else { Input.dragDX = 0; Input.zoom = 0; }
  P.moving = damp(P.moving, moving, 10, dt);
  P.root.position.y = damp(P.root.position.y, groundY(P.root.position.x, P.root.position.z), 20, dt);
  rigUpdate(P, dt);

  // follower spirit
  const F = W.follower;
  if (F) {
    const p = P.root.position, back = P.root.rotation.y + Math.PI;
    const tx = p.x + Math.sin(back) * 1.9 + Math.cos(back) * 0.9, tz = p.z + Math.cos(back) * 1.9 - Math.sin(back) * 0.9;
    const fp = F.root.position, dx = tx - fp.x, dz = tz - fp.z, dist = Math.hypot(dx, dz);
    if (dist > 12) { fp.x = tx; fp.z = tz; }
    const k = dist > 0.25 ? 1 : 0;
    fp.x = damp(fp.x, tx, 4.5, dt); fp.z = damp(fp.z, tz, 4.5, dt);
    fp.y = damp(fp.y, groundY(fp.x, fp.z), 12, dt);
    if (dist > 0.3) F.root.rotation.y = dampAngle(F.root.rotation.y, Math.atan2(dx, dz), 8, dt);
    else F.root.rotation.y = dampAngle(F.root.rotation.y, Math.atan2(p.x - fp.x, p.z - fp.z), 3, dt);
    F.moving = damp(F.moving, k * clamp(dist / 2, 0, 1), 8, dt);

  }
