<title>Eclipse Duel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen app. #app fills the viewport; #stage holds the WebGL canvas; #ui is the DOM overlay
   (HUD, menus, touch controls; styled by src/ui). Single dark look by design (a night arena). */
:root{
  color-scheme:dark;
  --ed-bg:#06070b; --ed-ink:#ece6da; --ed-dim:#9a958c; --ed-gold:#d8b46a; --ed-ember:#ff6a2b; --ed-frost:#7fd4ff; --ed-volt:#b48cff; --ed-blood:#c8283c;
  --ed-display:"Cinzel","Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --ed-body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{height:100%;margin:0;background:var(--ed-bg);color:var(--ed-ink);font-family:var(--ed-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ed-bg)}
#stage{position:absolute;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ed-error{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:16px;z-index:99;
  font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#ffd0d0;background:rgba(60,8,12,.92);border:1px solid rgba(255,120,120,.4);
  border-radius:8px;padding:10px 12px;white-space:pre-wrap;pointer-events:auto;max-height:40%;overflow:auto}
</style>
<div id="app"><div id="stage"><canvas id="gl" tabindex="0"></canvas></div><div id="ui"></div></div>
<script>/*__JS__*/</script>
